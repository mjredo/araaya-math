function roundDone(i=S.cur.r){return items(i).every(it=>solved(ist(it.id,round(i))))}
function roundStats(i,st=S,id=CUR){const R=st.rounds[i],its=itemsFor(st,id,i);const g=x=>R.items[x.id]||{status:"new"};const first=its.filter(it=>g(it).status==="first").length;
  const per={};its.forEach(it=>{const s=g(it);const p=per[it.skill]||(per[it.skill]={n:0,first:0,help:0});p.n++;if(s.status==="first")p.first++;else if(s.status==="guided")p.help++});
  const missed=Object.keys(per).filter(k=>per[k].first<per[k].n);
  const dur=R.finishedAt&&R.startedAt?Math.round((R.finishedAt-R.startedAt)/1000):null;
  return{n:its.length,first,per,missed,dur,perfect:first===its.length}}
const mmss=s=>{s=Math.max(0,Math.floor(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
const typeName=(R,st=S)=>R.type==="main"?(st.id==="T2-Q2"||CUR==="T2-Q2"&&st===S?"Chapter set":(AM(st.id||CUR)||{}).kind==="mid"?"Assessment test":"First test"):R.type==="strengthen"?`Strengthen round ${st.rounds.slice(0,R.no+1).filter(x=>x.type==="strengthen").length}`:`${(AM(st.id||CUR)||{}).kind==="mid"?"Practice test":"Timed test"} ${st.rounds.slice(0,R.no+1).filter(x=>x.type==="test").length}`;
// ---------- answer parsing ----------
const norm=s=>String(s??"").trim().replace(/[−–—]/g,"-").replace(/,/g,"").replace(/\s+/g,"");
const SUPS="⁰¹²³⁴⁵⁶⁷⁸⁹";
function num(s){const mx=String(s??"").trim().replace(/[−–—]/g,"-").match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);if(mx&&+mx[4])return(mx[1]?-1:1)*(+mx[2]+(+mx[3])/(+mx[4]));s=norm(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>"^"+[...m].map(c=>c==="⁻"?"-":SUPS.indexOf(c)).join(""));if(!s)return NaN;
  let m0=s.match(/^(-?\d*\.?\d+)[x×*]10\^(-?\d+)$/i);if(m0)return +m0[1]*Math.pow(10,+m0[2]);
  m0=s.match(/^\((-?\d*\.?\d+)\)\^(-?\d+)$/);if(m0)return Math.pow(+m0[1],+m0[2]);
  m0=s.match(/^(-?)(\d*\.?\d+)\^(-?\d+)$/);if(m0)return(m0[1]?-1:1)*Math.pow(+m0[2],+m0[3]);
  const f=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(f){const b=+f[2];return b===0?NaN:(+f[1])/b}
  return /^-?\d*\.?\d+$/.test(s)?+s:NaN}
const near=(a,b,t)=>Math.abs(a-b)<=(t??1e-6*Math.max(1,Math.abs(b)));

// ---------- rendering ----------
const PRAISE=["Correct!","Yes, that's it.","Nice work.","Exactly right.","You got it."];
const rpick=a=>a[Math.floor(Math.random()*a.length)];
function optButtons(opts,id,used,cls="opt"){return`<div class="opts" role="group">${opts.map((o,i)=>{const u=(used||[]).includes(i);return`<button class="${cls}${u?" used":""}" data-pick="${id}" data-i="${i}" ${u?"disabled":""}>${o}</button>`}).join("")}</div>`}
function typedInput(id){return`<span class="typed"><input class="in" id="${id}" autocomplete="off" aria-label="answer" placeholder="e.g. 12, −3.5, 3/4"><span class="kpad"><button type="button" class="kb" data-sup="${id}" aria-pressed="false" title="Type an exponent">x<sup>□</sup></button><button type="button" class="kb" data-ins="${id}" data-ch="−" title="Negative sign">−</button><button type="button" class="kb" data-ins="${id}" data-ch="/" title="Fraction bar">/</button></span></span>`}

function render(){
  const R=round(),its=items();
  document.getElementById("weekTitle").textContent=assessTitle(A());
  renderPrep();
  // stage bar
  const mainDone=!!S.rounds[0].finishedAt,anyTest=S.rounds.some(x=>x.type==="test");
  const stage=R.type==="main"?1:R.type==="strengthen"&&!anyTest?2:3;
  const dots=Array.from({length:need()},(_,i)=>`<span class="sdot ${i<S.streak?"on":""}"></span>`).join("");
  if(isMid()){const sd=Array.from({length:A().strNeed},(_,i)=>`<span class="sdot ${i<(S.sstreak||0)||anyTest?"on":""}"></span>`).join("");document.getElementById("stages").innerHTML=`<div class="stage ${stage===1?"now":mainDone?"done":""}"><b>1</b> Assessment test</div><div class="stage ${stage===2?"now":anyTest?"done":""}"><b>2</b> 10-question rounds <span class="streak" title="100% rounds in a row">${sd}</span></div><div class="stage ${stage===3?"now":""} ${S.proficient?"done":""}"><b>3</b> Full practice tests <span class="streak" title="100% practice tests in a row">${dots}</span></div>`}
  else document.getElementById("stages").innerHTML=`<div class="stage ${stage===1?"now":mainDone?"done":""}"><b>1</b> ${CUR==="T2-Q2"?"Chapter set":"First test"}</div><div class="stage ${stage===2?"now":anyTest?"done":""}"><b>2</b> Strengthen</div><div class="stage ${stage===3?"now":""} ${S.proficient?"done":""}"><b>3</b> Timed tests <span class="streak" title="Perfect timed tests in a row">${dots}</span></div>`;
  // round header
  const st=roundStats(S.cur.r);const solvedN=its.filter(it=>solved(ist(it.id))).length;
  let rh=`<div><div class="rtitle">${typeName(R)}</div><div class="rsub">${R.type==="main"&&isMid()?`${A().first} questions covering every skill in lessons ${A().span}, to find what still needs work${its.some(x=>x.lvl==="Re-test")?", plus re-test questions (R) on earlier weak spots":""}`:R.type==="test"&&isMid()?`A full practice test laid out like ${A().teacher} (${A().n} questions, new numbers every time). The clock is for her reference (about ${A().min} minutes). Goal: 100% on ${need()} tests in a row.`:R.type==="main"?(CUR==="T2-Q2"?"Chapter questions plus re-test questions from Unit 1":`${A().n} questions on ${A().kind==="cumulative"?"everything so far":"lessons "+A().lessons.join(", ")}${its.some(x=>x.lvl==="Re-test")?", plus re-test questions (R) on earlier weak spots":""}`):R.type==="strengthen"?"10 new questions on: "+R.skills.map(k=>SK[k]).join(", "):`${A().n} questions on this ${A().kind==="quiz"?"quiz":"test"}'s lessons only. Aim to finish within ${A().min} minutes.`}</div></div>`;
  rh+=`<div class="rnums"><span><b>${solvedN}</b>/${its.length} done</span><span><b>${st.first}</b> right first try</span>${R.type==="test"?`<span class="timer ${!R.finishedAt&&(Date.now()-R.startedAt)/1000>A().min*60?"over":""}" id="timer">⏱ ${mmss(((R.finishedAt||Date.now())-R.startedAt)/1000)} / ${A().min}:00</span>`:""}</div>`;
  document.getElementById("rhead").innerHTML=rh;
  const done=roundDone();
  document.getElementById("dots").innerHTML=its.map((it,i)=>`<button class="dot ${ist(it.id).status} ${i===S.cur.q?"cur":""}" data-go="${i}" aria-label="Question ${it.label}">${it.label}</button>`).join("")+(done?`<button class="dot sum ${S.cur.q==="summary"?"cur":""}" data-go="summary">Summary</button>`:"")+(S.rounds.length>1?`<button class="dot sum" data-history="1">Earlier rounds</button>`:"");
  if(S.cur.q==="summary")renderSummary();else renderCard();
  document.getElementById("prev").disabled=S.cur.q==="summary"||S.cur.q===0;
  document.getElementById("next").disabled=S.cur.q==="summary"||S.cur.q===its.length-1;
  document.getElementById("nav").hidden=S.cur.q==="summary";
  clearInterval(timerId);if(R.type==="test"&&!R.finishedAt)timerId=setInterval(()=>{const el=document.getElementById("timer");if(el){const sec=(Date.now()-R.startedAt)/1000;el.textContent=`⏱ ${mmss(sec)} / ${A().min}:00`;el.classList.toggle("over",sec>A().min*60)}},1000);
}

function renderCard(){
  const it=items()[S.cur.q],s=ist(it.id),f=flash[it.id];
  let h=`<div class="meta"><span class="qnum">${it.label}</span><span class="pill ${it.lvl}">${it.lvl==="Word"?"Word problem":it.lvl}</span><span>${SK[it.skill]}${LESSON[it.skill]?" · Lesson "+LESSON[it.skill]:""}</span></div><p class="q">${it.q}</p>`;
  if(!solved(s)){const locked=s.guide&&s.step<it.steps.length;h+=optButtons(it.opts,"main",locked?it.opts.map((_,i)=>i):s.picks);h+=`<p class="howto">${locked?"🔒 Choices are locked until you finish the steps below.":"Tap your answer."}</p>`}
  if(f)h+=`<div class="fb ${f.cls}">${f.text}</div>`;
  if(solved(s))h+=`<div class="fb ok"><b>${s.status==="first"?"Solved on the first try.":"Solved using the steps."}</b> Answer: ${s.final}</div>`;
  if(s.guide&&it.steps.length){
    h+=`<div class="guide"><h3>Let's work it out together</h3><p class="note">For each step, first choose what we should do next. Then do it.</p>`;
    it.steps.forEach((stp,i)=>{if(i>s.step)return;const done=i<s.step,planned=!!s.sp[i]||done;
      h+=`<div class="step ${done?"done":""}"><span class="lab">Step ${i+1} of ${it.steps.length}</span>`;
      if(!planned){h+=`<p class="ask">${stp.p}</p>`+optButtons(stp.po,"p"+i,s.pp[i],"opt plan");
        const last=(s.pp[i]||[]).slice(-1)[0];if(last!=null&&stp.pw[last])h+=`<div class="fb tip"><b>Not quite.</b> ${stp.pw[last]}</div>`}
      else{h+=`<p class="decided">✓ ${stp.po[stp.pa]}</p>`;if(stp.t)h+=`<p class="teach"><span class="whylab">Why:</span> ${stp.t}</p>`;
        if(stp.a){h+=`<p class="ask">${stp.a}</p>`;
          if(done){const rv=s.revealed.includes(i);h+=`<p class="why">✓ ${rv?"This step's answer: ":""}<b>${stp.kind==="choice"?stp.opts[stp.ans]:fmt(stp.ans)}</b></p>`}
          else{if(stp.kind==="choice")h+=optButtons(stp.opts,"s"+i,[]);else{h+=`<p class="howto">Type a number, decimal or fraction like 3/4. For an exponent, tap <b>x<sup>□</sup></b> and type it (tap again to go back). Example: 1 0 x<sup>□</sup> 4 gives 10<sup>4</sup>.</p><div class="answer">${typedInput("s"+i)}<button class="btn" data-checkstep="${i}">Check step</button></div>`}
            const m=s.miss[i]||0;if(m===1)h+=`<div class="fb tip"><b>Hint:</b> ${stp.h}</div>`;if(m>=2)h+=`<div class="fb tip"><b>Hint:</b> ${stp.h} One more try. If it's still stuck, the next check shows this step so you can keep going.</div>`}}}
      h+=`</div>`});
    if(s.step>=it.steps.length&&!solved(s))h+=`<div class="fb ok"><b>All steps done.</b> Now use what you worked out to pick the answer at the top.</div>`;
    h+=`</div>`}
  if(solved(s)){const its=items();const nextOpen=its.findIndex((x,i)=>i>S.cur.q&&!solved(ist(x.id)));const anyOpen=its.findIndex(x=>!solved(ist(x.id)));
    if(roundDone())h+=`<div><button class="btn" data-go="summary">See my summary →</button></div>`;
    else h+=`<div><button class="btn" data-go="${nextOpen>=0?nextOpen:anyOpen}">Next question →</button></div>`}
  document.getElementById("card").innerHTML=h;
  if(f!==undefined){const inp=document.querySelector(".step:not(.done) input.in");if(inp)inp.focus({preventScroll:true})}
}

function renderSummary(){
  const i=S.cur.r,R=round(i),st=roundStats(i);const pct=Math.round(st.first/st.n*100);
  let h=`<div class="sumtop"><div class="big">${st.first}<span>/${st.n}</span></div><div><div class="rtitle">${typeName(R)} complete</div><div class="rsub">${pct}% right on the first try${R.type==="test"&&st.dur!=null?` · finished in ${mmss(st.dur)} ${st.dur<=A().min*60?"(within "+A().min+" min ✓)":"(over "+A().min+" min)"}`:""}</div></div></div>`;
  h+=`<div class="tbl"><table><thead><tr><th>Skill</th><th>First try</th><th>With steps</th><th></th></tr></thead><tbody>${Object.entries(st.per).map(([k,p])=>`<tr><td>${SK[k]}</td><td>${p.first}/${p.n}</td><td>${p.help}</td><td class="st ${p.first===p.n?"first":"guided"}">${p.first===p.n?"Solid":"Practice"}</td></tr>`).join("")}</tbody></table></div>`;
  const last=i===S.rounds.length-1;
  if(!last){h+=`<p class="note">This is an earlier round. <button class="linkbtn" data-goround="${S.rounds.length-1}">Go to the current round →</button></p>`;document.getElementById("card").innerHTML=h;return}
  const chapterMissed=st.missed.filter(k=>skillsOf(A().lessons).includes(k));
  if(isMid()){const SN=A().strNeed,ss=S.sstreak||0;
    if(R.type==="test"){
      if(S.proficient)h+=`<div class="fb ok"><b>Ready for the ${A().card.replace(" prep","").toLowerCase()}!</b> ${need()} perfect practice tests in a row.</div><div class="actions"><button class="btn ghost" data-start="test">Take another practice test anyway</button></div>`;
      else if(st.perfect)h+=`<div class="fb ok"><b>100% on the practice test!</b> That's ${S.streak} of ${need()} in a row. One more perfect test and she's ready.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
      else h+=`<div class="fb tip"><b>Not 100% yet, so the practice-test streak starts again.</b> Let's strengthen: ${chapterMissed.map(k=>SK[k]).join(", ")}. She needs ${SN} passing 10-question rounds in a row before the next practice test (100%, or 90% from round ${STR_RELAX_AFTER+1} on).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
    }else if(R.type==="main"&&st.perfect){
      h+=`<div class="fb ok"><b>Every question right on the first try!</b> She can go straight to the full practice test (laid out like ${A().teacher}). Goal: 100% on ${need()} in a row.</div><div class="actions"><button class="btn" data-start="test">Start practice test 1 →</button></div>`;
    }else if(R.type==="strengthen"&&strPass(i)&&ss<SN){
      h+=`<div class="fb ok"><b>${st.perfect?"100% on this round!":`${st.first}/${st.n}. That passes (90% counts after ${STR_RELAX_AFTER} rounds)!`}</b> That's ${ss} of ${SN} perfect rounds in a row. One more 10-question round on ${(R.base||R.skills).map(k=>SK[k]).join(", ")} to lock it in.</div><div class="actions"><button class="btn" data-start="again">Next 10-question round →</button></div>`;
    }else if(R.type==="strengthen"&&strPass(i)){
      h+=`<div class="fb ok"><b>${SN} passing rounds in a row!</b> Now the full practice test, laid out like ${A().teacher} (${A().n} questions). Goal: 100% on ${need()} practice tests in a row.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    }else if(!chapterMissed.length){
      h+=`<div class="fb ok"><b>Every ${A().name} question was right on the first try.</b> The only misses were review questions from earlier topics (${st.missed.map(k=>SK[k]).join(", ")}). Those don't hold up mid-chapter prep, so next is the full practice test.</div><div class="actions"><button class="btn" data-start="test">Start practice test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    }else{
      h+=`<div class="fb tip"><b>${R.type==="main"?"Here's what still needs work":"Almost there. Let's keep strengthening"}:</b> ${chapterMissed.map(k=>SK[k]).join(", ")}.${chapterMissed.length<st.missed.length?" (Review questions from earlier topics are left out of these rounds.)":""} Next is a 10-question round with new numbers on just these skills. She needs ${SN} passing rounds in a row before the full practice test (100%, or 90% from round ${STR_RELAX_AFTER+1} on).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
    }
    document.getElementById("card").innerHTML=h;return}
  if(R.type==="test"){
    const counted=st.perfect&&st.dur<=A().min*60;
    if(S.proficient)h+=`<div class="fb ok big"><b>Chapter mastered!</b> ${need()} perfect timed tests in a row. She's ready for the class test.</div><div class="actions"><button class="btn ghost" data-start="test">Take another timed test anyway</button></div>`;
    else if(counted)h+=`<div class="fb ok"><b>Perfect test!</b> That's ${S.streak} of ${need()} in a row.</div><div class="actions"><button class="btn" data-start="test">Start timed test ${S.rounds.filter(x=>x.type==="test").length+1} →</button></div>`;
    else if(st.perfect)h+=`<div class="fb tip"><b>100%, but it took ${mmss(st.dur)}.</b> To count toward the ${need()}-in-a-row goal, a perfect test has to be finished within ${A().min} minutes. The streak starts again.</div><div class="actions"><button class="btn" data-start="test">Try another timed test →</button></div>`;
    else h+=`<div class="fb tip"><b>Not perfect yet, so the streak starts again.</b> Let's strengthen: ${chapterMissed.map(k=>SK[k]).join(", ")}.</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button><button class="btn ghost" data-start="test">Take another test instead</button></div>`;
  }else if(st.perfect||strPass(i)){
    h+=`<div class="fb ok"><b>${R.type==="main"?"Every question right on the first try!":st.perfect?"100% on this round. Those skills are stronger now.":`${st.first}/${st.n}. That passes (90% counts after ${STR_RELAX_AFTER} rounds).`}</b> Next: a timed test with ${A().n} new questions on these lessons. Aim to finish within ${A().min} minutes. You need ${need()} perfect tests in a row.</div><div class="actions"><button class="btn" data-start="test">Start timed test →</button></div>`;
  }else{
    h+=`<div class="fb tip"><b>Let's strengthen what wasn't right on the first try:</b> ${st.missed.map(k=>SK[k]).join(", ")}. You'll get 10 new questions with different numbers and styles. Keep going until you get them all right on the first try (from round ${STR_RELAX_AFTER+1} on, 90% is enough).</div><div class="actions"><button class="btn" data-start="strengthen">Practice these skills (10 questions) →</button></div>`;
  }
  document.getElementById("card").innerHTML=h;
}

// ---------- actions ----------
function finishRoundIfDone(){const R=round();if(R.finishedAt||!roundDone())return;R.finishedAt=Date.now();const st=roundStats(S.cur.r);
  if(R.type==="test"){if(st.perfect&&(A().timeRef||st.dur<=A().min*60)){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=need())S.proficient=true}else{S.streak=0}}
  if(R.type==="strengthen"){S.sstreak=strPass(S.cur.r)?(S.sstreak||0)+1:0}else S.sstreak=0;
  if(db){db.doc(`rounds/${storeKey(CUR)}_${R.no}`).set({week:storeKey(CUR),assessment:CUR,no:R.no,type:R.type,name:typeName(R),first:st.first,total:st.n,missed:st.missed,durationSec:st.dur,streakAfter:S.streak,finishedAt:new Date(R.finishedAt).toISOString()}).catch(()=>{})}}
function startRound(type){const prev=round(S.rounds.length-1),st=roundStats(S.rounds.length-1);let base=null,again=null;
  if(type==="again"){type="strengthen";again=(prev.base||prev.skills||[]).slice()}
  let skills=type==="strengthen"?(again||st.missed.slice()):null;if(type==="strengthen")base=again||(prev.type==="strengthen"?(prev.base||prev.skills):skills.slice());if(type==="strengthen"&&(prev.type==="test"||isMid()))skills=skills.filter(k=>skillsOf(A().lessons).includes(k));if(type==="strengthen"&&!skills.length)type="test";
  const no=S.rounds.length;const R={no,type,startedAt:Date.now(),items:{}};if(type==="strengthen"){R.skills=skills;R.base=(base||skills).filter(k=>G[k]&&(!isMid()||skillsOf(A().lessons).includes(k)));R.specs=strengthenSpecs(skills,no)}else R.specs=isMid()?midTestSpecs(CUR,no):pickSpecs(A().lessons,A().n,no,"test");
  S.rounds.push(R);S.cur={r:no,q:0};flash={};save();render();window.scrollTo({top:0,behavior:"smooth"})}

function pickMain(i){const it=items()[S.cur.q],s=ist(it.id);if(solved(s)||s.picks.includes(i))return;if(s.guide&&s.step<it.steps.length){flash[it.id]={cls:"tip",text:"<b>Finish the steps below first.</b> The answer choices unlock when the last step is done."};render();return}s.tries++;
  if(i===it.ans){s.status=s.tries===1?"first":"guided";s.final=it.opts[i];flash[it.id]={cls:"ok",text:`<b>${rpick(PRAISE)}</b>${s.status==="guided"?" Working through it step by step paid off.":""}`};finishRoundIfDone()}
  else{s.picks.push(i);s.status="working";s.wrong.push(plain(it.opts[i]));const ww=it.ww[i]?it.ww[i]+" ":"";
    if(!s.guide){s.guide=true;flash[it.id]={cls:"no",text:`<b>Not yet.</b> ${ww}Let's work through it one step at a time below. Come back and pick an answer whenever you're ready.`}}
    else flash[it.id]={cls:"no",text:`<b>Not yet.</b> ${ww}${s.step<it.steps.length?"Finish the next step below first. It leads to the answer.":"Look back at what each step gave you and put those pieces together."}`}}
  save();syncResult(it,s);render()}
function pickPlan(i,k){const it=items()[S.cur.q],s=ist(it.id),stp=it.steps[i];const pp=s.pp[i]||(s.pp[i]=[]);if(pp.includes(k))return;
  if(k===stp.pa){s.sp[i]=true;if(!stp.a)s.step=i+1;flash[it.id]=undefined}else{pp.push(k)}save();render()}
function checkStep(i,val){const it=items()[S.cur.q],s=ist(it.id),stp=it.steps[i];let ok;
  if(stp.kind==="choice")ok=val===stp.ans;else{const v=num(val);if(isNaN(v)){flash[it.id]={cls:"tip",text:"Type a number, a decimal, or a fraction like 3/4."};return render()}ok=near(v,stp.ans,stp.tol)}
  if(ok){s.step=i+1;flash[it.id]=undefined}else{s.miss[i]=(s.miss[i]||0)+1;if(s.miss[i]>=3){s.revealed.push(i);s.step=i+1;flash[it.id]={cls:"tip",text:"Here's that step so you can keep going. Read why it works, then try the next step."}}else flash[it.id]=undefined}
  save();render()}
async function syncResult(it,s){if(!db||round().type!=="main"||CUR!=="T2-Q2")return;const WEEK="oct26";try{await db.doc(`results/${WEEK}_${it.id}`).set({week:WEEK,qid:it.id,status:s.status,tries:s.tries,wrong:s.wrong,stepsDone:s.step,stepsRevealed:s.revealed.length,final:s.final||"",updatedAt:new Date().toISOString()})}catch(e){}}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go!==undefined){S.cur.q=d.go==="summary"?"summary":+d.go;flash={};save(false);render();if(d.go==="summary"||t.classList.contains("btn"))window.scrollTo({top:0,behavior:"smooth"});return}
  if(d.goround!==undefined){S.cur={r:+d.goround,q:roundDone(+d.goround)?"summary":0};render();return}
  if(d.history){showHistory();return}
  if(t.id==="prev"&&S.cur.q>0){S.cur.q--;flash={};render();return}
  if(t.id==="next"&&S.cur.q<items().length-1){S.cur.q++;flash={};render();return}
  if(d.start){startRound(d.start);return}
  if(d.copyres){const lines=[`${A().name} — Araaya's Math Lab results (copied ${new Date().toLocaleString()})`];S.rounds.forEach((R,i)=>{const x=roundStats(i);lines.push(`${typeName(R)}: ${R.finishedAt?x.first+"/"+x.n:R.skipped?"skipped by parent":"in progress"}${R.finishedAt&&R.startedAt?` in ${Math.round((R.finishedAt-R.startedAt)/60000)} min`:""}${x.missed.length?" · missed: "+x.missed.map(k=>SK[k]||k).join(", "):""}`)});lines.push(`Practice-test streak: ${S.streak}/${need()}${S.proficient?" (ready)":""}`);
    const t=lines.join("\n"),m=document.getElementById("cmsg");try{navigator.clipboard.writeText(t).then(()=>{if(m)m.innerHTML=`<div class="fb ok">Copied. Paste it into Claude.</div>`},()=>{if(m)m.innerHTML=`<textarea class="in" style="width:100%;height:160px">${t}</textarea>`})}catch(e){if(m)m.innerHTML=`<textarea class="in" style="width:100%;height:160px">${t}</textarea>`}return}
  if(d.override){const c=(document.getElementById("pcode")||{}).value||"";const m=document.getElementById("pmsg");if(hash(c.trim().toUpperCase())!==PCODE&&!(PCH&&c.trim()!==""&&Number(c.trim().replace(/[−–]/g,"-"))===PCH.ans)){if(m)m.innerHTML=`<div class="fb no">That code isn't right.</div>`;return}PCH=null;parentSkip(d.override);return}
  if(d.sup){const on=t.getAttribute("aria-pressed")!=="true";t.setAttribute("aria-pressed",String(on));const inp=document.getElementById(d.sup);if(inp){inp.dataset.supmode=on?"1":"0";inp.classList.toggle("supmode",on);inp.focus()}return}
  if(d.ins){const inp=document.getElementById(d.ins);if(inp){const ch=inp.dataset.supmode==="1"&&d.ch==="−"?"⁻":d.ch;const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;inp.setRangeText(ch,a,b,"end");inp.focus()}return}
  if(d.checkstep!==undefined){const i=+d.checkstep;checkStep(i,(document.getElementById("s"+i)||{}).value||"");return}
  if(d.pick){const k=+d.i;if(d.pick==="main")pickMain(k);else if(d.pick[0]==="p")pickPlan(+d.pick.slice(1),k);else checkStep(+d.pick.slice(1),k);return}
  if(t.id==="tabPractice"||t.id==="tabParent"||t.id==="tabCourse"){showTab(t.id);return}
  if(d.open){open(d.open);showTab("tabPractice");render();window.scrollTo({top:0});return}
  if(d.cum){const sel=document.getElementById("cumSel");if(sel){open("CUM-"+sel.value);showTab("tabPractice");render();window.scrollTo({top:0})}return}
});
const SUPMAP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","−":"⁻"};
document.addEventListener("beforeinput",e=>{const t=e.target;if(!t.matches||!t.matches("input.in")||t.dataset.supmode!=="1"||e.inputType!=="insertText"||!e.data)return;
  const out=[...e.data].map(c=>SUPMAP[c]||c).join("");if(out===e.data)return;e.preventDefault();const a=t.selectionStart??t.value.length,b=t.selectionEnd??a;t.setRangeText(out,a,b,"end")});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.matches("input.in"))return;e.target.closest(".step")?.querySelector("[data-checkstep]")?.click()});

function parentSkip(to){const last=S.rounds.length-1,R=round(last);if(!R.finishedAt){R.skipped=true;R.skippedAt=Date.now()}
  (S.overrides=S.overrides||[]).push({at:Date.now(),from:R.type,round:last,to});
  if(to==="ready"){S.proficient=true;S.streak=Math.max(S.streak,need());S.cur={r:last,q:roundDone(last)?"summary":0};save();showTab("tabPractice");render();return}
  S.sstreak=0;if(to==="strengthen"&&R.type==="strengthen"&&!R.finishedAt){R.finishedAt=null}
  startRound(to);showTab("tabPractice");render()}
function showHistory(){let h=`<div class="rtitle">All rounds</div><div class="tbl"><table><thead><tr><th>Round</th><th>Score</th><th>Time</th><th></th></tr></thead><tbody>`;
  S.rounds.forEach((R,i)=>{const st=roundStats(i);h+=`<tr><td>${typeName(R)}</td><td>${R.finishedAt?st.first+"/"+st.n:R.skipped?"skipped by parent":"in progress"}</td><td>${R.type==="test"&&st.dur!=null?mmss(st.dur):"—"}</td><td><button class="linkbtn" data-goround="${i}">Open</button></td></tr>`});
  document.getElementById("card").innerHTML=h+`</tbody></table></div>`;document.getElementById("nav").hidden=true}

function renderParent(){
  let h=`<h3 class="rtitle">Course progress</h3><div class="tbl"><table><thead><tr><th>Quiz / test</th><th>Status</th><th>Rounds</th><th>Last score</th></tr></thead><tbody>${ASSESS.filter(a=>STORE[a.id]).map(a=>{const st=STORE[a.id],s=statusOf(a.id);const fin=st.rounds.map((R,i)=>[R,i]).filter(x=>x[0].finishedAt).pop();const ls=fin?roundStats(fin[1],st,a.id):null;return`<tr><td>${a.name}</td><td class="st ${s.cls}">${s.txt}</td><td>${st.rounds.length}</td><td>${ls?ls.first+"/"+ls.n:"—"}</td></tr>`}).join("")||`<tr><td colspan="4">Nothing started yet.</td></tr>`}</tbody></table></div><h3 class="rtitle">${A().name}</h3>
  <div class="score"><span>Stage: <b>${S.proficient?"Mastered":round(S.rounds.length-1).type==="main"?(isMid()?"Assessment test":"Chapter set"):round(S.rounds.length-1).type==="strengthen"?"Strengthening":"Timed tests"}</b></span><span>Perfect ${isMid()?"practice":"timed"} tests in a row: <b>${S.streak}</b>/${need()}</span><span>Best streak: <b>${S.best}</b></span></div>
  <div class="tbl"><table><thead><tr><th>Round</th><th>First try</th><th>%</th><th>Time</th><th>Skills missed</th></tr></thead><tbody>`;
  S.rounds.forEach((R,i)=>{const st=roundStats(i);h+=`<tr><td>${typeName(R)}</td><td>${R.finishedAt?st.first+"/"+st.n:(R.skipped?"skipped by parent (":"in progress (")+items(i).filter(it=>solved(ist(it.id,R))).length+"/"+st.n+" done)"}</td><td>${R.finishedAt?Math.round(st.first/st.n*100)+"%":"—"}</td><td>${R.type==="test"&&st.dur!=null?mmss(st.dur)+(st.dur>A().min*60?" ⚠":""):"—"}</td><td>${st.missed.map(k=>SK[k]).join(", ")||(R.finishedAt?"None":"—")}</td></tr>`});
  h+=`</tbody></table></div><h3 class="rtitle" style="font-size:17px">Questions in ${typeName(round())}</h3><div class="tbl"><table><thead><tr><th>Q</th><th>Skill</th><th>Result</th><th>Tries</th><th>Wrong answers picked</th><th>Steps shown</th></tr></thead><tbody>`;
  const lab={first:"Right first try",guided:"Solved with steps",working:"Still working",new:"Not started"};
  items().forEach(it=>{const s=ist(it.id);h+=`<tr><td><b>${it.label}</b></td><td>${SK[it.skill]}</td><td class="st ${s.status}">${lab[s.status]}</td><td>${s.tries||0}</td><td>${(s.wrong||[]).join(" · ")||"—"}</td><td>${(s.revealed||[]).length}</td></tr>`});
  h+=`</tbody></table></div><p class="note">${db?"Progress is saved to this page, so it carries across devices and Claude can read it to plan next week.":"Progress shown is from this device only."} “Steps shown” counts steps where she missed three times and the page showed that step.</p>`;
  const mid=isMid(),T3=mid?"practice tests":"timed tests";
  h+=`<div class="card override"><h3 class="rtitle" style="font-size:17px">Parent override</h3><p class="note">Move ${A().name} to a later step without finishing the current one. This needs the parent code.${(S.overrides||[]).length?` Used ${(S.overrides||[]).length} time(s) here: ${(S.overrides||[]).map(o=>o.to+" ("+new Date(o.at).toLocaleDateString()+")").join(", ")}.`:""}</p>
  <p class="note">Type the parent code, <b>or</b> answer this parent check: ${(PCH||newPCH(),PCH).q}</p><div class="answer"><input class="in" id="pcode" type="password" autocomplete="off" placeholder="Code or answer" aria-label="Parent code or answer"></div>
  <div class="actions"><button class="btn ghost" data-override="strengthen">Skip to 10-question rounds</button><button class="btn ghost" data-override="test">Skip to ${T3}</button><button class="btn ghost" data-override="ready">Mark as ${mid?"ready":"mastered"}</button></div><div id="pmsg"></div></div>`;
  h+=`<div class="card"><h3 class="rtitle" style="font-size:17px">Send results to Claude</h3><p class="note">Copies a short summary of every round in ${A().name} so you can paste it into Claude (useful when she practices on the web copy, where Claude can't see her progress).</p><div class="actions"><button class="btn ghost" data-copyres="1">Copy results</button></div><div id="cmsg"></div></div>`;
  document.getElementById("parent").innerHTML=h}
function showTab(id){const map={tabPractice:"practice",tabCourse:"course",tabParent:"parent"};for(const k in map){const on=k===id;document.getElementById(map[k]).hidden=!on;document.getElementById(k).setAttribute("aria-pressed",String(on))}
  document.getElementById("stages").hidden=id!=="tabPractice";if(id!=="tabPractice")document.getElementById("prep").hidden=true;else renderPrep();if(id==="tabParent"){PCH=null;renderParent()}if(id==="tabCourse")renderCourse()}
function statusOf(id){const st=STORE[id];if(!st||!st.rounds)return{cls:"new",txt:"Not started"};
  const dots=Array.from({length:needOf(id)},(_,i)=>`<span class="sdot ${i<st.streak?"on":""}"></span>`).join("");const mid=(AM(id)||{}).kind==="mid";
  if(st.proficient)return{cls:"first",txt:`${mid?"Ready":"Mastered"} <span class="streak">${dots}</span>`};
  const R=st.rounds[st.rounds.length-1];const its=itemsFor(st,id,st.rounds.length-1);const done=its.filter(it=>{const s=R.items[it.id];return s&&(s.status==="first"||s.status==="guided")}).length;
  if(R.type==="main")return done===its.length?{cls:"guided",txt:"Done · summary ready"}:{cls:"working",txt:`${id==="T2-Q2"?"Chapter set":mid?"Assessment":"First test"} ${done}/${its.length}`};
  if(R.type==="strengthen")return{cls:"guided",txt:mid?`10-question rounds (${st.sstreak||0}/${(AM(id)||{}).strNeed} at 100%)`:"Strengthening"};
  return{cls:"guided",txt:`${mid?"Practice tests":"Timed tests"} <span class="streak">${dots}</span>`}}
function renderCourse(){
  let h=`<div class="rtitle">All quizzes &amp; tests</div><p class="note">Quiz 1 covers the lessons before the Mid-Topic Checkpoint, Quiz 2 the lessons after it, and the Chapter Test covers the whole topic. Each one runs the same process: a first test (with re-test questions on earlier weak spots), strengthen rounds until 100%, then timed tests until ${NEED_STREAK} perfect in a row.</p>`;
  for(const T of COURSE){h+=`<section class="topic"><div class="thead"><span class="tnum">Topic ${T.t}</span><span class="tname">${T.name}</span>${T.done?'<span class="pill">Unit test taken</span>':""}</div>
    <details><summary>${T.lessons.length} lessons${T.page?" · "+T.page:""}</summary><ul class="lessons">${T.lessons.map(l=>`<li><b>${l[0]}</b> ${l[1]}</li>`).join("")}</ul>${T.note?`<p class="note">${T.note}</p>`:""}</details>
    <div class="arow">${ASSESS.filter(a=>a.kind==="mid"&&a.topic===T.t).map(a=>{const s=statusOf(a.id);return`<button class="acard ${a.id===CUR?"cur":""}" data-open="${a.id}"><span class="aname">${a.card||"Mid-Chapter Test"}</span><span class="ales">${a.lessons[0]} – ${a.lessons[a.lessons.length-1]}</span><span class="st ${s.cls}">${s.txt}</span></button>`}).join("")}${["Q1","Q2","CH"].map(x=>{const a=AM(`T${T.t}-${x}`),s=statusOf(a.id);return`<button class="acard ${a.id===CUR?"cur":""}" data-open="${a.id}"><span class="aname">${x==="CH"?"Chapter Test":x==="Q1"?"Quiz 1":"Quiz 2"}</span><span class="ales">${x==="CH"?"All lessons":a.lessons[0]+" – "+a.lessons[a.lessons.length-1]}</span><span class="st ${s.cls}">${s.txt}</span></button>`}).join("")}</div></section>`}
  const cums=ASSESS.filter(a=>a.kind==="cumulative");
  h+=`<section class="topic"><div class="thead"><span class="tnum">Cumulative</span><span class="tname">Semester and year-end review</span></div><p class="note">Covers every lesson from Topic 1 through the topic you choose (${cums[0].n} questions, ${cums[0].min} minutes).</p>
    <div class="answer"><label for="cumSel">Through</label><select id="cumSel" class="in">${COURSE.filter(t=>t.t>=2).map(t=>`<option value="${t.t}">Topic ${t.t}: ${t.name}</option>`).join("")}</select><button class="btn" data-cum="1">Open</button></div>
    <div class="arow">${cums.filter(a=>STORE[a.id]).map(a=>{const s=statusOf(a.id);return`<button class="acard" data-open="${a.id}"><span class="aname">${a.name}</span><span class="st ${s.cls}">${s.txt}</span></button>`}).join("")}</div></section>`;
  document.getElementById("course").innerHTML=h}

// ---------- Test prep panel: follows the newest prep assessment (Topic 3 Chapter Test, Fri Nov 13 2026) ----------
const PREP_ID="T3-CHX";
function midInfo(){const st=STORE[PREP_ID];const R=(st&&st.rounds)||[];
  const firstPerfect=!!(R[0]&&R[0].finishedAt&&roundStats(0,st,PREP_ID).perfect);
  return{firstDone:!!(R[0]&&R[0].finishedAt),strDone:R.some(x=>x.type==="test")||firstPerfect||!!(st&&(st.sstreak||0)>=2),test1:!!(st&&(st.streak>=1||st.proficient)),ready:!!(st&&st.proficient)}}
function prepSteps(){const a=AM(PREP_ID);return[
 {goal:`Assessment test: ${a.first} questions on every ${a.span} skill, to see what still needs work`,done:i=>i.firstDone},
 {goal:"10-question rounds on the missed skills until she passes 2 rounds in a row (100%, or 90% from the 3rd round on)",done:i=>i.strDone},
 {goal:`Full practice test (${a.n} questions): first 100%`,done:i=>i.test1},
 {goal:`Second 100% practice test in a row = ready for the ${a.card.replace(" prep","").toLowerCase()}`,done:i=>i.ready}]}
function fin(id,pred){const st=STORE[id];return !!(st&&st.rounds&&st.rounds.some(R=>R.finishedAt&&pred(R)))}
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function renderPrep(){const el=document.getElementById("prep");if(!el)return;const a=AM(PREP_ID),i=midInfo();if((i.ready||todayISO()>a.date)&&CUR!==PREP_ID){el.hidden=true;return}el.hidden=false;const steps=prepSteps(),cur=steps.findIndex(x=>!x.done(i));
  const dl=new Date(a.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  el.innerHTML=`<div class="prephead"><span class="tnum">${a.name} prep</span><span class="tname">Lessons ${a.span} · test ${dl}</span></div><ol class="plan">${steps.map((d,k)=>{const done=d.done(i),now=k===cur;
    return`<li class="${done?"done":now?"now":""}"><span class="pday">Step ${k+1}</span><span class="pgoal">${d.goal}</span><span class="pact">${done?"✓ Done":now?(CUR===PREP_ID?"← now":`<button class="btn sm" data-open="${PREP_ID}">Start</button>`):""}</span></li>`}).join("")}</ol>`}
if(!lsGet("mathlab3:t3chx-intro")){lsSet("mathlab3:current",PREP_ID);lsSet("mathlab3:t3chx-intro",1);lsSet("mathlab3:t3mid-intro",1)}
loadLocal();open(CUR);render();
(async()=>{try{db=await window.claude?.use?.("db")}catch(e){db=null}if(!db)return;
  try{const snap=await db.collection("progress").get();let hasT2=false;
    snap.docs.forEach(d=>{const v=d.data();if(!v||!v.json)return;let st;try{st=JSON.parse(v.json)}catch(e){return}const id=v.id||(d.id==="oct26"?"T2-Q2":d.id);if(!AM(id))return;if(id==="T2-Q2")hasT2=true;st.id=id;
      if(!STORE[id]||(v.updatedAt||0)>(STORE[id].updatedAt||0)){STORE[id]=st;lsSet("mathlab2:"+storeKey(id),st)}});
    if(!hasT2){const prev=CUR;open("T2-Q2");const rs=await db.collection("results").where("week","==","oct26").get();let ch=false;
      rs.docs.forEach(x=>{const r=x.data();if(!r)return;const s=ist(r.qid,S.rounds[0]);
        if(s.status==="new"&&(r.status==="first"||r.status==="guided")){Object.assign(s,{status:r.status,tries:r.tries||1,wrong:(r.wrong||[]).map(plain),final:r.final||""});ch=true}
        else if(s.status==="new"&&r.status==="working"){Object.assign(s,{status:"working",tries:r.tries||1,wrong:(r.wrong||[]).map(plain),guide:true,step:0});ch=true}});
      if(ch){const c=S.cur;S.cur={r:0,q:c.q};finishRoundIfDone();S.cur=c;save()}open(prev)}
    ITEMS={};S=STORE[CUR];render()}catch(e){}})();
