<script>
// ===== helpers =====
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const int=(r,lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const RD=x=>Math.round(x*1e9)/1e9;
function fmt(x){x=RD(x);const ax=Math.abs(x);let s=Number.isInteger(ax)&&ax>=1000?ax.toLocaleString("en-US"):String(ax);if(/e/i.test(s))s=ax.toFixed(14).replace(/0+$/,"");return(x<0?"−":"")+s}
const fE=e=>typeof e==="number"?(e<0?"−"+(-e):String(e)):e;
const fP=n=>n<0?`(${fmt(n)})`:fmt(n);
const pw=(b,e)=>`${typeof b==="number"?fmt(b):b}<sup>${fE(e)}</sup>`;
const sn=(c,e)=>`${fmt(c)} × 10<sup>${fE(e)}</sup>`;
const plain=h=>String(h).replace(/<sup>/g,"^").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function mc(r,good,bad){const seen=new Set([plain(good)]);const items=[[good,null]];
  for(const [t,w] of bad){const k=plain(t);if(seen.has(k))continue;seen.add(k);items.push([t,w]);if(items.length===4)break}
  const sh=shuffle(r,items);return{opts:sh.map(x=>x[0]),ww:sh.map(x=>x[1]),ans:sh.findIndex(x=>x[1]===null)}}
function stp(r,o){const m=mc(r,o.good,o.bad);return{p:o.p,po:m.opts,pw:m.ww,pa:m.ans,t:o.t||"",a:o.a||null,kind:o.kind||"num",ans:o.ans,opts:o.opts,h:o.h||"Check your arithmetic, especially the signs.",tol:o.tol}}
function item(skill,lvl,q,good,bad,steps,r){const m=mc(r,good,bad);return{skill,lvl,q,opts:m.opts,ww:m.ww,ans:m.ans,steps}}
const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
function bigDigits(ds,e){return Number(ds.padEnd(e+1,"0")).toLocaleString("en-US")}
function smallDigits(ds,e){return "0."+"0".repeat(-e-1)+ds}
const cDigits=c=>String(c).replace(".","").replace(/^0+/,"");

const SK={prod:"Multiplying powers (same base)",quot:"Dividing powers (same base)",powpow:"Power of a power",prodpow:"Power of a product",zero:"Zero exponents",neg:"Negative exponents",multi:"Multi-step exponent rules",est:"Estimating with powers of 10",ratio:"Comparing amounts with powers of 10",toSci:"Writing scientific notation",fix:"Fixing scientific notation",order:"Comparing scientific notation",mult:"Multiplying in scientific notation",div:"Dividing in scientific notation",addsub:"Adding & subtracting in scientific notation",word:"Scientific notation word problems",
 change:"Re-test: change and rate",zdiv:"Re-test: zero rules",signexp:"Re-test: negative signs with exponents",inverse:"Re-test: inverse of a negative mixed number",simplify:"Re-test: simplifying fractions"};
const LESSON={prod:"2-6",quot:"2-6",powpow:"2-6",prodpow:"2-7",zero:"2-7",neg:"2-7",multi:"2-7",est:"2-8",ratio:"2-8",toSci:"2-9",fix:"2-9",order:"2-9",mult:"2-10",div:"2-10",addsub:"2-10",word:"2-10"};
const LESSON_SKILLS={"2-6":["prod","quot","powpow"],"2-7":["prodpow","zero","neg","multi"],"2-8":["est","ratio"],"2-9":["toSci","fix","order"],"2-10":["mult","div","addsub","word"]};
const CHAPTER=["prod","quot","powpow","prodpow","zero","neg","multi","est","ratio","toSci","fix","order","mult","div","addsub","word"];
const VARS={prod:["single","missing","eval"],quot:["single","eval","negres"],powpow:["single","missing"],prodpow:["eval","expand"],zero:["negout","paren","expr","plain"],neg:["neg","recip","dec"],multi:["a"],est:["big","small"],ratio:["a"],toSci:["big","small"],fix:["big","small","check"],order:["least","greatest","order"],mult:["a"],div:["a"],addsub:["add","sub"],word:["count","diff","total"],change:["change","rate"],zdiv:["top","bottom","pow"],signexp:["paren","noparen"],inverse:["a"],simplify:["a"]};

// shared step builders
function planMultSame(r,b,m,n){return stp(r,{p:"Both powers have the same base and we're multiplying. What should we do?",good:"Keep the base and add the exponents",
  bad:[["Multiply the bases","When the bases match, the base never changes. Only the count of factors changes."],["Multiply the exponents","Multiplying exponents is the rule for a power raised to a power, like (a<sup>m</sup>)<sup>n</sup>."],["Subtract the exponents","Subtracting is for dividing powers."]],
  t:`${pw(b,m)} is ${m<0?"one over "+(-m)+" copies":m+" copies"} of ${b}, and ${pw(b,n)} adds ${n} more. Counting all the copies together means adding the exponents.`,a:`${fmt(m)} + ${fP(n)} = ?`,ans:m+n})}
function planSign(r,big){return stp(r,{p:"Should the exponent be positive or negative?",good:big?"Positive, because the number is bigger than 10":"Negative, because the number is between 0 and 1",
  bad:[[big?"Negative, because there are a lot of zeros":"Positive, because there are zeros",big?"Lots of zeros on the end make a big number. Big numbers get positive exponents.":"Zeros right after the decimal point make a small number. Small numbers get negative exponents."],["Zero","Only numbers from 1 up to 10 have exponent 0."]],
  t:"A positive exponent multiplies by 10s (bigger). A negative exponent divides by 10s (smaller)."})}

// ===== generators =====
const G={
prod(r,o){const v=o.v||pick(r,VARS.prod);
  if(v==="eval"){const b=o.b??pick(r,[2,3]);const m=o.m??int(r,1,3),n=o.n??int(r,2,3),t=m+n,val=b**t;
    return item("prod",o.lvl||"Challenge",`Evaluate ${pw(b,m)} · ${pw(b,n)} as a number.`,fmt(val),[[fmt(b**(m*n)),`That's ${b} to the ${m*n} power. You multiplied the exponents instead of adding them.`],[fmt((b*b)**t),`That multiplies the bases. The base stays ${b}.`],[fmt(b*t),`That's ${b} × ${t}, not ${b} to the ${t} power.`],[fmt(b**(t-1)),"Recount the factors."]],
      [planMultSame(r,b,m,n),stp(r,{p:`Now we have ${pw(b,t)}. How do we turn it into a number?`,good:`Multiply ${t} copies of ${b} together`,bad:[[`Multiply ${b} × ${t}`,"An exponent counts repeated factors. It doesn't multiply the base by the exponent."],[`Add ${t} copies of ${b}`,"Exponents mean repeated multiplication, not addition."]],
        t:`${pw(b,t)} = ${Array(t).fill(b).join(" · ")}. Multiply one pair at a time.`,a:`${pw(b,t)} = ?`,ans:val})],r)}
  const b=o.b??pick(r,[2,3,5,7,10,"x","y"]);
  if(v==="missing"){const m=o.m??int(r,2,7),n=o.n??int(r,2,8),t=m+n;
    return item("prod",o.lvl||"Challenge",`Find the missing exponent: ${pw(b,m)} · ${pw(b,"?")} = ${pw(b,t)}`,fmt(n),[[fmt(t+m),`Adding ${m} would make the total ${t+m+m}, not ${t}.`],[fmt(t*m),"Multiplying powers adds exponents, so look for a number that adds to the total."],[fmt(m-t),"Subtract in the other order: total − the one you know."]],

  neg(a){return[-a[0],a[1]]},
  v(a){return a[0]/a[1]},
  s(a){const[n,d]=a;return d===1?fmt(n):(n<0?"−":"")+Math.abs(n)+"/"+d},           // canonical text: −7/4, 3
  p(a){return a[0]<0?"("+T1.s(a)+")":T1.s(a)},                                        // wrapped in ( ) when negative

// repeating decimal with a bar; the hidden span keeps options with different bars distinct as text
function t2bar(ip,pre,rep){const s=ip+"."+pre;if(!rep)return pre?s:String(ip);return `${s}<span style="text-decoration:overline">${rep}</span><span style="display:none"> (${rep} repeats)</span>`}
function t2dots(ip,pre,rep,len){len=len||7;let s=pre;if(!rep)return pre?ip+"."+pre:String(ip);while(s.length<len)s+=rep;return `${ip}.${s}…`}
function t2val(ip,pre,rep){const D=(rep?(10**rep.length-1):1)*10**pre.length;const N=rep?Number(ip+pre+rep)-Number(ip+pre):Number(ip+pre);return N/D}
function t2div(n,d){const ip=Math.floor(n/d);let rem=n%d;const digs=[],rems=[],seen={};
  while(rem!==0&&seen[rem]==null){seen[rem]=digs.length;rems.push(rem);rem*=10;digs.push(Math.floor(rem/d));rem=rem%d}
  if(rem===0)return{ip,pre:digs.join(""),rep:"",rems:rems.concat([0])};const st=seen[rem];return{ip,pre:digs.slice(0,st).join(""),rep:digs.slice(st).join(""),rems:rems.concat([rem])}}
function t2fr(n,d){const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?fmt(n):(n<0?"−":"")+Math.abs(n)+"/"+d}

const t2isSq=n=>n>=0&&Number.isInteger(Math.sqrt(n));
const t2rt=n=>t2isSq(n)?fmt(Math.sqrt(n)):`√${n}`;
function t2nonsq(r,lo,hi){let n;do{n=int(r,lo,hi)}while(t2isSq(n));return n}
function t2coprime(r,lo,d){let n;do{n=int(r,lo,d-1)}while(gcd(n,d)!==1);return n}

// rational / irrational number pools for 2-2: [kind, html, why, checkStep(r)|null]
function t2rat(r,kind){
  if(kind==="sqsq"){const k=int(r,2,12);return{k:kind,h:`√${k*k}`,why:`√${k*k} works out to a whole number, so it's rational.`,v:k,chk:()=>stp(r,{p:`Check √${k*k}. What number times itself makes ${k*k}?`,good:"Find it by testing whole numbers",bad:[["There isn't one, every root is irrational",`Try a few: something × itself does make ${k*k}.`]],t:`If √${k*k} is a whole number, it's rational.`,a:`√${k*k} = ?`,ans:k})}}
  if(kind==="cbrt"){const k=int(r,2,5);return{k:kind,h:`∛${k**3}`,why:`∛${k**3} works out to a whole number, so it's rational.`,v:k,chk:()=>stp(r,{p:`Check ∛${k**3}. What does it mean?`,good:`The number that, used 3 times as a factor, makes ${k**3}`,bad:[[`${k**3} ÷ 3`,"A cube root isn't dividing by 3."]],t:`If ∛${k**3} is a whole number, it's rational.`,a:`∛${k**3} = ?`,ans:k})}}

      t:`If x = ${x}, multiplying by ${fmt(M)} shifts the point ${k} place${k>1?"s":""}: ${fmt(M)}x = ${sh}. The repeating tails now line up.`,a:"Multiply x by what number?",ans:M}));

  return steps}

  for(let i=1;i<=xmax;i++)s+=`<text x="${X(i)-3}" y="${oy+15}">${i}</text>`;

// ---------- 3-3: solve proportions with cross products ----------
t3_crossmult(r,o){const v=o.v||pick(r,VARS.t3_crossmult);const vn=pick(r,["k","p","r","v","x","n"]);let A,B,C,D,h;
  if(v==="decimal"){for(let i=0;i<300;i++){B=pick(r,[10,4,5,2,20]);A=int(r,B+1,B*2+3);if(gcd(A,B)!==1)continue;D=int(r,6,15);C=A*D/B;if(!Number.isInteger(C)&&Number.isInteger(RD(C*100)))break}h=2}
  else{let p,q;do{p=int(r,1,9);q=int(r,1,9)}while(p===q||gcd(p,q)!==1);const m1=int(r,1,4),m2=int(r,2,8);[A,B,C,D]=[p*m1,q*m1,p*m2,q*m2];if(r()<0.5)[A,B,C,D]=[C,D,A,B];h=v==="den"?pick(r,[1,3]):pick(r,[0,2])}
  const vals=[A,B,C,D],X=vals[h];const show=vals.map((x,i)=>i===h?vn:fmt(x));
  // cross pairs: (0,3) and (1,2)
  const partner=[3,2,1,0][h],other=[[1,2],[0,3],[0,3],[1,2]][h];const prod=vals[other[0]]*vals[other[1]],div=vals[partner];
  const k=[0,1,2,3].filter(i=>i!==h);const cand=[[vals[k[0]]*vals[k[1]]/vals[k[2]],"That pairs the wrong numbers. Cross multiply along the diagonals."],[vals[k[0]]*vals[k[2]]/vals[k[1]],"That pairs the wrong numbers. Cross multiply along the diagonals."],[vals[k[1]]*vals[k[2]]/vals[k[0]],"That pairs the wrong numbers. Cross multiply along the diagonals."],[prod,`That's the cross product. Divide it by ${fmt(div)} to get ${vn} alone.`],[h===3?B+(C-A):h===2?A+(D-B):h===1?A+(D-C):B+(C-D),"That adds the same amount instead of multiplying. Proportions scale by multiplying."],[X+1,"Recheck the division at the end."],[X*2,"Recheck: divide the cross product by the number paired with the variable."]];
  const bad=cand.filter(([x])=>isFinite(x)&&x>0&&Math.abs(x-X)>1e-9&&Number.isInteger(RD(x*100))).map(([x,w])=>[fmt(RD(x)),w]);
  return item("t3_crossmult",o.lvl||(v==="decimal"?"Challenge":"Basic"),`Solve the proportion: ${t3F(show[0],show[1])} = ${t3F(show[2],show[3])}`,`${vn} = ${fmt(X)}`,bad.map(([t,w])=>[`${vn} = ${t}`,w]),
    [stp(r,{p:"What's a reliable way to solve a proportion?",good:"Cross multiply: set the two diagonal products equal",bad:[["Multiply straight across the tops and bottoms","That's how to multiply fractions, not solve a proportion."],["Add the numbers on each side","Proportions are about multiplying."]],t:`For a/b = c/d, the cross products are equal: a × d = b × c. Here that's ${show[0]} × ${show[3]} = ${show[1]} × ${show[2]}.`,a:`Multiply the two numbers on the diagonal without ${vn}: ${fmt(vals[other[0]])} × ${fmt(vals[other[1]])} = ?`,ans:prod}),
     stp(r,{p:`Now ${fmt(div)}${vn} = ${fmt(prod)}. How do we get ${vn} alone?`,good:`Divide both sides by ${fmt(div)}`,bad:[[`Subtract ${fmt(div)} from both sides`,`${vn} is multiplied by ${fmt(div)}, so divide.`],[`Multiply both sides by ${fmt(div)}`,"That makes it bigger instead of getting the variable alone."]],t:"Check: put your answer back in and see if both fractions are equal.",a:`${fmt(prod)} ÷ ${fmt(div)} = ?`,ans:X})],r)},

// ---------- 3-3: unit conversions with proportions ----------
t3_convert(r,o){const v=o.v||pick(r,VARS.t3_convert);
  const U=pick(r,[["yard","yards","inch","inches",36,n=>`How long, in inches, is a ${n}-yard fence?`],["foot","feet","inch","inches",12,n=>`How long, in inches, is a ${n}-foot board?`],["hour","hours","minute","minutes",60,n=>`How many minutes long is a ${n}-hour movie marathon?`],["gallon","gallons","quart","quarts",4,n=>`How many quarts does a ${n}-gallon fish tank hold?`],["yard","yards","foot","feet",3,n=>`How long, in feet, is a ${n}-yard garden row?`],["pound","pounds","ounce","ounces",16,n=>`How many ounces are in a ${n}-pound bag of flour?`]]);
  const f=U[4];const n=o.n??int(r,2,f>=36?8:12),m=n*f;const fact=`1 ${U[0]} = ${f} ${U[3]}.`;
  const good=v==="up"?`1 ${U[0]} / ${f} ${U[3]} = ${n} ${U[1]} / x ${U[3]}`:`1 ${U[0]} / ${f} ${U[3]} = x ${U[1]} / ${m} ${U[3]}`;
  const flip=v==="up"?`1 ${U[0]} / ${f} ${U[3]} = x ${U[3]} / ${n} ${U[1]}`:`1 ${U[0]} / ${f} ${U[3]} = ${m} ${U[3]} / x ${U[1]}`;
  const prop=(a,ans)=>stp(r,{p:"How can we set this up?",good:`As a proportion: ${good}`,bad:[[flip,"Keep the units lined up: the bigger unit on top and the smaller unit on the bottom on BOTH sides."],[`Add ${f} to the number`,`Each ${U[0]} is worth ${f} ${U[3]}, so it's a multiplying relationship.`]],t:v==="up"?`Every ${U[0]} is ${f} ${U[3]}, so x = ${n} × ${f}.`:`Every ${f} ${U[3]} make 1 ${U[0]}, so x = ${m} ÷ ${f}.`,a,ans});
  if(v==="down")return item("t3_convert",o.lvl||"Basic",`${fact} How many ${U[1]} are in ${m} ${U[3]}?`,`${n} ${U[1]}`,
    [[`${fmt(m*f)} ${U[1]}`,`That multiplies. ${U[1]} are bigger units, so there are fewer of them. Divide.`],[`${fmt(m-f)} ${U[1]}`,"Subtracting doesn't convert units."],[`${fmt(n+1)} ${U[1]}`,"Recheck the division."]],[prop(`x = ${m} ÷ ${f} = ?`,n)],r);
  return item("t3_convert",o.lvl||"Word",`${fact} ${U[5](n)}`,`${fmt(m)} ${U[3]}`,
    [[`${t3fr(n,f)} ${U[3]}`,`That divides. ${U[3]} are smaller units, so there are more of them. Multiply.`],[`${fmt(n+f)} ${U[3]}`,`Adding doesn't convert. Each ${U[0]} is ${f} ${U[3]}, so multiply.`],[`${fmt(m+f)} ${U[3]}`,"Recheck the multiplication."]],[prop(`x = ${n} × ${f} = ?`,m)],r);
},

// ---------- new variants on existing skills ----------
t3_unitrate(r,o){const v=o.v||pick(r,VARS.t3_unitrate);if(v!=="wage")return T3OLD.unitrate(r,{...o,v});
  const u=o.u??pick(r,[8.75,9.5,10.25,12.5,11.75,14.25,15.5]),h=o.h??int(r,6,16),T=RD(u*h);const nm=pick(r,["Rosita","Zoe","Telly","Abby"]);
  return item("t3_unitrate",o.lvl||"Word",`${nm} makes ${t3$(T)} babysitting for ${h} hours. How much does ${nm} make per hour?`,`${t3$(u)} per hour`,
    [[`${t3$(T*h)} per hour`,"That multiplies. Per hour means divide by the hours."],[`${t3$(RD(Math.round(h/T*100)/100))} per hour`,"That divides hours by dollars. Put the dollars on top."],[`${t3$(RD(T/(h-1)))} per hour`,`Divide by all ${h} hours.`],[`${t3$(u+1)} per hour`,"Recheck the long division."]],
    [stp(r,{p:"How do we find the pay for 1 hour?",good:`Divide the money by the hours: ${t3$(T)} ÷ ${h}`,bad:[[`Multiply ${t3$(T)} × ${h}`,"That's bigger than the total. One hour pays less than the total."],[`Divide ${h} ÷ ${t3$(T)}`,"That's hours per dollar."]],t:`Long division: ${h} into ${fmt(T)}. Keep the decimal point lined up.`,a:`${fmt(T)} ÷ ${h} = ?`,ans:u})],r)},

t3_proptest(r,o){const v=o.v||pick(r,VARS.t3_proptest);
  if(v==="fee"){const p=o.p??pick(r,[8,10,12,15,20]),q=pick(r,[5,8,10]),F=pick(r,[50,75,100,120]);const sw=r()<0.5;const L=sw?["B","A"]:["A","B"];// L[0] = no-fee gym
    const desc=sw?`Gym A charges $${F} to join and $${q} per visit. Gym B has no joining fee and charges $${p} per visit.`:`Gym A has no joining fee and charges $${p} per visit. Gym B charges $${F} to join and $${q} per visit.`;
    return item("t3_proptest",o.lvl||"Word",`${desc} Which gym's cost can be written as y = kx (x = visits, y = cost), and what is the equation?`,`Gym ${L[0]}: y = ${p}x`,
      [[`Gym ${L[1]}: y = ${q}x`,`Gym ${L[1]} costs $${F} even with 0 visits, so its graph doesn't go through (0, 0). It isn't proportional.`],[`Gym ${L[1]}: y = ${q}x + ${F}`,`That equation is right for Gym ${L[1]}, but it isn't the form y = kx because of the + ${F}.`],[`Gym ${L[0]}: y = x + ${p}`,"y = kx multiplies x by the price per visit. It doesn't add."],[`Both gyms: y = ${p}x and y = ${q}x`,`Gym ${L[1]}'s joining fee means 0 visits cost $${F}, not $0.`]],
      [stp(r,{p:"What has to be true for a cost to be proportional (y = kx)?",good:"0 visits cost $0, and every visit adds the same amount",bad:[["The price per visit is low","Cheap or expensive doesn't matter. Look for (0, 0)."],["The total cost goes up","Both go up, but one starts above $0."]],t:"A proportional relationship always passes through (0, 0): zero visits must cost zero dollars.",a:`How much does the gym with the joining fee cost for 0 visits?`,ans:F}),
       stp(r,{p:`So only the no-fee gym is proportional. What is its k?`,good:`The price per visit, $${p}`,bad:[[`The joining fee, $${F}`,"The fee is a starting amount, not a rate."],["The number of visits","x is the visits. k is the cost for each visit."]],t:`Equation: y = kx, with k = cost per visit.`,a:"k = ?",ans:p})],r)}
  if(v==="money"){const u=o.u??pick(r,[1.5,1.25,2.5,0.75,2.25,3.5]),xs=shuffle(r,[2,3,4,5,6,7,8,9,10,12]).slice(0,3).sort((a,b)=>a-b);const prop=o.prop??r()<0.6;const j=int(r,1,2);
    const ys=xs.map((x,i)=>!prop&&i===j?RD(u*x+pick(r,[0.5,-0.5,1])):RD(u*x));const it=pick(r,[["lemonades","lemonade"],["cookies","cookie"],["tacos","taco"]]);
    const rows=xs.map((x,i)=>`${x} ${it[0]} for ${t3$(ys[i])}`).join("<br>");
    return item("t3_proptest",o.lvl||"Word",`Is this sale of ${it[0]} proportional? If so, what is the cost of one ${it[1]}?<br><span style="display:inline-block;margin:6px 0 0 12px">${rows}</span>`,prop?`Yes, ${t3$(u)} per ${it[1]}`:`No. The price for one isn't the same in every row`,
      prop?[["No. The prices go up by different amounts","The counts jump by different amounts too. Check price ÷ count for each row."],[`Yes, ${t3$(ys[0])} per ${it[1]}`,`That's the price for ${xs[0]}, not for 1.`],[`Yes, ${t3$(RD(ys[1]-ys[0]))} per ${it[1]}`,`That's the jump between rows, but the count jumped by ${xs[1]-xs[0]}.`],["No. The numbers aren't multiples of each other","Check the price for one in each row."]]
          :[[`Yes, ${t3$(u)} per ${it[1]}`,"Check every row, not just the first."],[`Yes, ${t3$(ys[0])} per ${it[1]}`,`That's the price for ${xs[0]}. And check each row.`],["Yes. More costs more","Costing more isn't enough. The price for one must stay the same."]],
      [stp(r,{p:"How do we test if the sale is proportional?",good:"Find price ÷ count (the price of one) for every row",bad:[["See if the prices go up","Prices can go up without being proportional."],["Add up all the prices","Totals don't show the rate."]],t:"Proportional means the unit price is the same in every row.",a:`Row 1: ${fmt(ys[0])} ÷ ${xs[0]} = ?`,ans:RD(ys[0]/xs[0]),tol:0.005}),
       stp(r,{p:"What next?",good:"Do the same for the other rows and compare",bad:[["Stop after one row","Every row has to match."],["Multiply the rows","Divide to find the price of one."]],a:`Row ${j+1}: ${fmt(ys[j])} ÷ ${xs[j]} = ? <span class="note">(round to the cent if needed)</span>`,ans:RD(ys[j]/xs[j]),tol:0.006})],r)}
  return T3OLD.proptest(r,{...o,v})},

t3_propmissing(r,o){const v=o.v||pick(r,VARS.t3_propmissing);if(v!=="howmany")return T3OLD.propmissing(r,{...o,v});
  const u=o.u??pick(r,[0.5,0.25,0.75,1.5,2,1.25]),n=o.n??pick(r,[8,12,16,20,24,32]),T=RD(u*n);let m=o.m??int(r,3,15);if(m===n)m++;const B=RD(u*m);
  const it=pick(r,[["kiwi fruit","kiwi"],["oranges","oranges"],["pencils","pencils"],["stickers","stickers"]]);const nm=pick(r,["Dora","Diego","Boots","Elmo"]);
  return item("t3_propmissing",o.lvl||"Word",`${nm} bought ${n} ${it[0]} for ${t3$(T)}. At the same price each, how many ${it[1]} can ${nm} buy with ${t3$(B)}?`,`${m} ${it[1]}`,
    [[`${fmt(RD(B*n))} ${it[1]}`,"That multiplies dollars by the count. Find the price of one first."],[`${t3fr(Math.round(B*100),Math.round(T*100))} ${it[1]}`,`That's the fraction of the money. It tells what part of the ${n} you can buy.`],[`${fmt(n+m)} ${it[1]}`,`That adds. Find the price of one, then see how many fit into ${t3$(B)}.`],[`${fmt(m+1)} ${it[1]}`,"Recheck the division."]],
    [stp(r,{p:"What should we find first?",good:`The price of 1 (unit price): ${t3$(T)} ÷ ${n}`,bad:[[`${n} ÷ ${t3$(T)}`,"That's items per dollar. It works too, but price per item is easier to check."],[`${t3$(T)} × ${n}`,"Multiplying doesn't give a price for one."]],a:`${fmt(T)} ÷ ${n} = ?`,ans:u}),
     stp(r,{p:`Each costs ${t3$(u)}. How many can ${t3$(B)} buy?`,good:`Divide: ${t3$(B)} ÷ ${t3$(u)}`,bad:[[`Multiply ${t3$(B)} × ${t3$(u)}`,"How many fit into the money means divide."],[`Subtract ${t3$(u)} from ${t3$(B)}`,"That only buys one."]],a:`${fmt(B)} ÷ ${fmt(u)} = ?`,ans:m})],r)},

t3_constk(r,o){const v=o.v||pick(r,VARS.t3_constk);if(v!=="dozen")return T3OLD.constk(r,{...o,v});
  const k=o.k??pick(r,[2.75,1.25,3.5,2.5,1.75,4.25]),C=RD(12*k);const it=pick(r,[["roses","rose","A florist"],["donuts","donut","A bakery"],["eggs","egg","A farm stand"]]);

    [stp(r,{p:"What does k mean here?",good:`The cost of 1 ${it[1]}`,bad:[["The cost of a dozen","k is for 1, not 12."],["The number in a dozen","k is a price per item."]],t:`k = total cost ÷ number of ${it[0]}. A dozen is 12.`,a:"How many is a dozen?",ans:12}),
     stp(r,{p:"Now find k.",good:`${t3$(C)} ÷ 12`,bad:[[`12 ÷ ${t3$(C)}`,`That's ${it[0]} per dollar.`],[`${t3$(C)} × 12`,"Multiplying gives the price of 12 dozen."]],a:`${fmt(C)} ÷ 12 = ?`,ans:k})],r)},

t3_graph(r,o){const v=o.v||pick(r,VARS.t3_graph);if(v!=="eqn")return T3OLD.graph(r,{...o,v});
  const C=pick(r,[{k:[45,49,52,55,60],xl:"hours",yl:"miles",t:"Vacation Driving"},{k:[3,4,6,8],xl:"pizzas",yl:"dollars",t:"Pizza Cost"},{k:[12,15,18],xl:"hours",yl:"dollars",t:"Pay"}]);
  const k=o.k??pick(r,C.k),a=int(r,2,4),b=k*a,xmax=Math.max(a+2,6);const svg=t3svg(k,[[a,b]],xmax,C.xl,C.yl);

const T4c=x=>Math.round(RD(x*100))/100;                       // round to the cent
const T4m=x=>{x=T4c(x);return(x<0?"−":"")+"$"+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const T4p=x=>fmt(RD(x))+"%";
const T4pa=x=>{const y=Math.round(RD(x)*10)/10;return(Math.abs(y-x)>1e-9?"about ":"")+fmt(y)+"%"};
const T4nm=["Maya","Leo","Priya","Sam","Ava","Diego","Nora","Kai"];
function T4fr(x){let n=Math.round(RD(x)*10000),d=10000;const g=gcd(n,d);return[n/g,d/g]}
const T4fs=f=>f[1]===1?fmt(f[0]):`${f[0]}/${f[1]}`;
function T4dec(r,p){return stp(r,{p:`How do we write ${fmt(p)}% as a decimal?`,good:"Divide by 100 (move the decimal point 2 places left)",
  bad:[["Divide by 10","Percent means “per hundred,” so we divide by 100, not 10."],["Just drop the % sign",`${fmt(p)}% is not the same as ${fmt(p)}. It means ${fmt(p)} out of 100.`]],
  t:`Percent means “per hundred,” so ${fmt(p)}% = ${fmt(p)} ÷ 100.`,a:`${fmt(p)}% as a decimal = ?`,ans:RD(p/100),h:"Move the decimal point 2 places to the left."})}
// keep only wrong options whose value differs from the right one: list of [text, why, value]
const T4f=(list,val)=>list.filter(x=>x[2]==null||Math.abs(x[2]-val)>1e-9).map(x=>[x[0],x[1]]);

// item() wrapper: drop wrong options that read as the right answer ("about 2%" vs "2%") or are negative money
function T4it(skill,lvl,q,good,bad,steps,r){const g=plain(good);return item(skill,lvl,q,good,bad.filter(b=>{const t=plain(b[0]);return t.replace(/^about /,"")!==g&&!/^−\$/.test(t)&&!/^\$0\.00$/.test(t)}),steps,r)}
// percent proportion pieces (mode = which piece is unknown: part | whole | pct)
function T4propEqs(mode,p,W,part){const P=fmt(part),Wf=fmt(W);
  const good={part:`x/${Wf} = ${p}/100`,whole:`${P}/x = ${p}/100`,pct:`${P}/${Wf} = x/100`}[mode];
  const truth={part,whole:W,pct:p}[mode];
  const A="The part goes on top and the whole goes on the bottom.",B="The percent goes on top, over 100.",C="Keep the pairs together: part/whole on one side, percent/100 on the other.";
  const bad={part:[[`${Wf}/x = ${p}/100`,A,100*W/p],[`x/${Wf} = 100/${p}`,B,100*W/p],[`x/100 = ${Wf}/${p}`,C,100*W/p],[`${p}/x = ${Wf}/100`,C,100*p/W]],
    whole:[[`x/${P} = ${p}/100`,A,p*part/100],[`${P}/x = 100/${p}`,B,p*part/100],[`${p}/x = ${P}/100`,C,100*p/part]],
    pct:[[`${Wf}/${P} = x/100`,A,100*W/part],[`${P}/${Wf} = 100/x`,B,100*W/part],[`x/${P} = ${Wf}/100`,C,part*W/100]]}[mode];
  return{good,bad:T4f(bad,truth)}}
function T4propSteps(r,mode,p,W,part){const E=T4propEqs(mode,p,W,part),P=fmt(part),Wf=fmt(W);
  const s1=stp(r,{p:"Which proportion matches this problem?",good:E.good,bad:E.bad.slice(0,3),
    t:`part/whole = percent/100. Here the whole is ${mode==="whole"?"unknown (x)":Wf}, the part is ${mode==="part"?"unknown (x)":P}, and the percent is ${mode==="pct"?"unknown (x)":p}.`});
  const cross={p:"How do we solve the proportion for x?",good:"Cross-multiply, then divide to get x alone",bad:[["Add the two tops and the two bottoms","Proportions are solved with multiplication and division, not addition."],["Multiply straight across the top","Cross products multiply on the diagonals."]]};
  if(mode==="part")return[s1,stp(r,{...cross,t:`Cross products: 100 · x = ${p} × ${Wf}.`,a:`${p} × ${Wf} = ?`,ans:p*W}),stp(r,{p:`Now 100 · x = ${fmt(p*W)}. How do we get x alone?`,good:"Divide both sides by 100",bad:[["Multiply both sides by 100","x is already multiplied by 100. Undo it by dividing."],["Subtract 100","x is multiplied by 100, not added to it."]],a:`x = ${fmt(p*W)} ÷ 100 = ?`,ans:part})];
  if(mode==="whole")return[s1,stp(r,{...cross,t:`Cross products: ${p} · x = ${P} × 100.`,a:`${P} × 100 = ?`,ans:RD(part*100)}),stp(r,{p:`Now ${p} · x = ${fmt(RD(part*100))}. How do we get x alone?`,good:`Divide both sides by ${p}`,bad:[[`Multiply both sides by ${p}`,`x is already multiplied by ${p}. Undo it by dividing.`],[`Subtract ${p}`,`x is multiplied by ${p}, not added to it.`]],a:`x = ${fmt(RD(part*100))} ÷ ${p} = ?`,ans:W})];
  return[s1,stp(r,{...cross,t:`Cross products: ${Wf} · x = ${P} × 100.`,a:`${P} × 100 = ?`,ans:RD(part*100)}),stp(r,{p:`Now ${Wf} · x = ${fmt(RD(part*100))}. How do we get x alone?`,good:`Divide both sides by ${Wf}`,bad:[[`Multiply both sides by ${Wf}`,"Undo multiplication by dividing."],[`Subtract ${Wf}`,`x is multiplied by ${Wf}, not added to it.`]],a:`x = ${fmt(RD(part*100))} ÷ ${Wf} = ?`,ans:p})]}
function T4propItem(r,skill,lvl,mode,p,W,q,money){const part=RD(p*W/100),f=money?T4m:fmt;let good,bad;
  const nice=x=>Math.abs(RD(x*100)-Math.round(RD(x*100)))<1e-9;
  if(mode==="part"){good=f(part);bad=[[f(RD(p*W)),"Don't forget to divide by 100."],...(nice(100*W/p)?[[f(RD(100*W/p)),"Check the proportion: the part (unknown) goes over the whole."]]:[]),[f(RD(W-part)),`That's the amount NOT included, the other ${100-p}%.`],[f(RD(part*10)),"Check the decimal point: divide by 100, not 10."]]}
  else if(mode==="whole"){good=f(W);bad=[[f(RD(part*p/100)),`That finds ${p}% of ${fmt(part)}. Here ${fmt(part)} is the part, and the whole is unknown.`],...(nice(100*p/part)?[[f(RD(100*p/part)),"Check the proportion: part on top, whole on the bottom."]]:[]),...(nice(part/p)?[[f(RD(part/p)),"Don't forget the 100 in the percent fraction."]]:[]),[f(RD(W*10)),"Check the division and the decimal point."]]}
  else{good=T4p(p);bad=[[T4pa(100*W/part),"That divides the whole by the part. The part goes on top."],[T4p(part),"The part isn't the percent. Compare it to the whole first."],[T4p(RD(part/W)),"That's the decimal. A percent is that decimal × 100."]]}
  return item(skill,lvl,q,good,bad,T4propSteps(r,mode,p,W,part),r)}

// percent change / error shared steps
function T4chgSteps(r,a,b,base,what){const d=RD(Math.abs(b-a)),pp=RD(d/base*100);
  return[stp(r,{p:"What do we find first?",good:`The amount of ${what}: the difference between the two numbers`,bad:[["The sum of the two numbers",`Adding doesn't show how much it changed.`],["The new number ÷ the old number","That compares the whole new amount, not just the change."]],t:"Percent "+what+" compares the size of the "+what+" to the starting (or actual) amount.",a:`Amount of ${what} = ?`,ans:d,h:"Subtract the smaller number from the larger one."}),
    stp(r,{p:`Now divide the ${what} by which amount?`,good:`The ${what==="error"?"actual":"original"} amount, ${fmt(base)}`,bad:[[`The ${what==="error"?"measured or estimated":"new"} amount`,`Percent ${what} is always compared to the ${what==="error"?"actual (true)":"original (starting)"} amount.`],["100","Divide by 100 only to turn a percent into a decimal."]],
      t:`Percent ${what} = ${what} ÷ ${what==="error"?"actual":"original"}.`,a:`${fmt(d)} ÷ ${fmt(base)} = ? (decimal)`,ans:RD(d/base)}),
    stp(r,{p:"We have a decimal. How do we write it as a percent?",good:"Multiply by 100 (move the decimal point 2 places right)",bad:[["Divide by 100","That makes it smaller. Going from decimal to percent multiplies by 100."],["Just add a % sign","The number must be 100 times bigger when it gets a % sign."]],t:"A decimal like 0.25 means 25 hundredths, which is 25%."})]}

// simple-interest numbers with a cents-exact answer
function T4si(r,o,months){for(let i=0;i<200;i++){const P=o.P??pick(r,[500,600,800,1000,1200,1500,2000,2500,3000,4000,5000]),rt=o.rate??pick(r,[1.5,2,2.5,3,3.5,4,4.5,5,6]);

t5_factor(r,o){const v=o.v||pick(r,VARS.t5_factor);let g,a,b;do{g=o.g??int(r,2,9);a=int(r,2,9);b=v==="gcf"?int(r,1,9):nz(r,-9,9)}while(gcd(a,Math.abs(b))!==1);

    return item("t5_factor","Basic",`What is the greatest common factor (GCF) of ${g*a}x and ${g*b}?`,fmt(g),bad,
      [stp(r,{p:"How do we find the GCF of two terms?",good:"Find the greatest number that divides both coefficients evenly",bad:[["Multiply the numbers","That makes a multiple, not a factor."],["Include x","x must be in BOTH terms to be part of the GCF."]],t:`List factors of ${g*a} and ${g*b} and find the biggest one they share.`,a:`GCF of ${g*a} and ${g*b} = ?`,ans:g})],r)}

       stp(r,{p:"Now the constant?",good:`Divide it by −${g} too`,bad:[["Keep it the same","Each term inside is the original term divided by −"+g+"."],["Make it positive","The sign comes from the division rule."]],a:`${fmt(-g*b)} ÷ (−${g}) = ?`,ans:b})],r)}

     stp(r,{p:"What goes inside the parentheses?",good:`Each term divided by ${g}`,bad:[[`Each term minus ${g}`,"Factoring divides; it doesn't subtract."],["The original terms","They must be divided by the GCF."]],t:`Check by distributing: ${g} times the inside should give back ${q}.`,a:`${fmt(g*b)} ÷ ${g} = ?`,ans:b})],r)},

// ----- topic 7 helpers -----
const T7=(c,x="x")=>c===1?x:c===-1?"−"+x:fmt(c)+x;                        // coefficient term: 3x, −x, 0.5x
function t7L(a,b,x="x"){if(a===0)return fmt(b);let s=T7(a,x);if(b>0)s+=" + "+fmt(b);else if(b<0)s+=" − "+fmt(-b);return s}   // ax + b
function t7red(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]}
function t7f(n,d){[n,d]=t7red(n,d);return d===1?fmt(n):(n<0?"−":"")+Math.abs(n)+"/"+d}       // plain fraction text
function t7F(n,d){[n,d]=t7red(n,d);return d===1?fmt(n):(n<0?"−":"")+`<sup>${Math.abs(n)}</sup>&frasl;<sub>${d}</sub>`}
function t7mx(n,d,x="x"){[n,d]=t7red(n,d);if(n===0)return"0";return d===1?T7(n,x):t7F(n,d)+x}
function t7Y(n,d,b){if(n===0)return"y = "+fmt(b);return"y = "+t7mx(n,d)+(b>0?" + "+fmt(b):b<0?" − "+fmt(-b):"")}
const t7ok=v=>v!=null&&isFinite(v)&&Math.abs(v*100-Math.round(v*100))<1e-6;
const t7$=v=>{v=RD(v);return(v<0?"−":"")+"$"+(Number.isInteger(v)?fmt(Math.abs(v)):Math.abs(v).toFixed(2))};
const t7pt=(x,y)=>`(${fmt(x)}, ${fmt(y)})`;
// numeric distractors: drop unclean / equal-to-answer ones, add safe fallbacks
function t7B(good,cands,F=fmt){const out=[];for(const [v,w] of cands){if(!t7ok(v))continue;if(RD(v)===RD(good))continue;out.push([F(RD(v)),w])}
  out.push([F(RD(good+1)),"Close, but recheck the arithmetic in your last step."],[F(RD(good-1)),"Close, but recheck the arithmetic in your last step."],[F(RD(good+2)),"Recheck each step of your work."]);return out}
function t7T(xl,yl,xs,ys){const c='style="border:1px solid currentColor;padding:2px 10px;text-align:center"';
  return `<table style="border-collapse:collapse;margin:6px 0"><tr><th ${c}>${xl}</th>${xs.map(v=>`<td ${c}>${fmt(v)}</td>`).join("")}</tr><tr><th ${c}>${yl}</th>${ys.map(v=>`<td ${c}>${fmt(v)}</td>`).join("")}</tr></table>`}
const t7nz=(r,lo,hi)=>{let v=0;while(v===0)v=int(r,lo,hi);return v};
// step: kx + b = d  ->  undo the constant
function t7undoB(r,k,b,d,x="x"){return stp(r,{p:`Now we have ${t7L(k,b,x)} = ${fmt(d)}. What's the next move?`,good:b>0?`Subtract ${fmt(b)} from both sides`:`Add ${fmt(-b)} to both sides`,
  bad:[[b>0?`Add ${fmt(b)} to both sides`:`Subtract ${fmt(-b)} from both sides`,"That doesn't cancel the number. Use the opposite operation."],[...(k===1?[`Do it to the left side only`,"Whatever you do to one side, do to the other side too."]:[`Divide only the ${T7(k,x)} by ${fmt(k)}`,"Whatever you do to one term, you must do to every term on both sides."])]],
  t:`Undo the ${b>0?"+ "+fmt(b):"− "+fmt(-b)} with the opposite operation, on both sides so they stay equal.`,a:`${fmt(d)} ${b>0?"−":"+"} ${fmt(Math.abs(b))} = ?`,ans:RD(d-b)})}
const t7I=(sk,l,q,g,b,st,r)=>item(sk,l,q,g,b,st.filter(Boolean),r);   // drops null steps
const t7FN=' <span class="note">(a fraction like 5/3 is fine)</span>';
// step: kx = rhs -> divide (skipped when k = 1)
function t7div(r,k,rhs,ans,x="x"){if(k===1)return null;return stp(r,{p:`Now ${T7(k,x)} = ${fmt(rhs)}. How do we get ${x} alone?`,good:`Divide both sides by ${fmt(k)}`,
  bad:[[`Subtract ${fmt(k)} from both sides`,`${fmt(k)} is multiplied by ${x}, so subtracting won't undo it.`],[`Multiply both sides by ${fmt(k)}`,"Use the opposite operation. The opposite of multiplying is dividing."],...(k>0?[]:[[`Divide both sides by ${fmt(-k)}`,"Divide by the coefficient exactly, sign included."]])],
  t:"Division undoes multiplication. Watch the signs.",a:`${fmt(rhs)} ÷ ${fP(k)} = ?`,ans})}

      [stp(r,{p:"What should we do first?",good:`Combine the like terms ${T7(a)} and ${T7(c)}`,bad:[[`Combine ${T7(a)} and ${fmt(b)}`,"An x term and a plain number are not like terms."],[`Divide everything by ${a}`,"There are two x terms. Put them together first."]],t:"Like terms have the same variable part. Add their coefficients.",a:`${T7(a)} + ${T7(c)} = ?x`,ans:k}),

       t7div(r,2*A+C,T,c,"c")],r)}
  if(v==="perimeter"){let a,x,k;for(let i=0;i<100;i++){a=int(r,2,3);x=int(r,3,12);k=int(r,1,9);if(2*x+k>a*x&&a*x>k)break}a=o.a??a;x=o.x??x;k=o.k??k;const P=(a+2)*x+k;

     stp(r,{p:`How do we undo the ${n} outside?`,good:`Divide both sides by ${n}`,bad:[[`Subtract ${n} from both sides`,"The "+n+" multiplies, so subtracting won't undo it."],[`Subtract ${s} from ${T} first`,`The ${s} is inside the parentheses, so it's really ${n} × ${s}.`]],t:"That gives what one friend spent.",a:`${T} ÷ ${n} = ?`,ans:T/n}),

// ===== 7-4 No solution / infinitely many =====
t7_numsol(r,o){const v=o.v||pick(r,VARS.t7_numsol);const L={one:"One solution",none:"No solution",inf:"Infinitely many solutions"};
  const why={one:{none:"The x terms don't cancel here, so x has exactly one value.",inf:"The x terms don't cancel here, so x has exactly one value."},
    none:{one:"After you gather the x terms, no x is left to solve for.",inf:"Look at the numbers left over. Do they match?"},
    inf:{one:"After you gather the x terms, no x is left to solve for.",none:"Look at the numbers left over. Is the statement true or false?"}};
  // build an equation of a given type; returns {q, kL (left x coef), kR, cL, cR}
  const make=(T,form)=>{const a=int(r,2,6),b=t7nz(r,-9,9);let e;
    if(form==="dist"){const L0=`${a}(${t7L(1,b)})`,cL=a*b;
      if(T==="inf")return{q:`${L0} = ${t7L(a,cL)}`,kL:a,kR:a,cL,cR:cL};
      if(T==="none"){e=cL+t7nz(r,-5,5);return{q:`${L0} = ${t7L(a,e)}`,kL:a,kR:a,cL,cR:e}}
      let m=a+t7nz(r,-2,3);if(m===0)m=a+1;e=int(r,-9,9);return{q:`${L0} = ${t7L(m,e)}`,kL:a,kR:m,cL,cR:e}}
    const s=int(r,2,5),p=a,q=b,K=p+s;   // px + q + sx = ...
    const Ls=`${t7L(p,q)} + ${T7(s)}`;
    if(T==="inf")return{q:`${Ls} = ${t7L(K,q)}`,kL:K,kR:K,cL:q,cR:q};
    if(T==="none"){e=q+t7nz(r,-6,6);return{q:`${Ls} = ${t7L(K,e)}`,kL:K,kR:K,cL:q,cR:e}}
    let m=K+t7nz(r,-3,3);if(m===0)m=K+1;e=int(r,-9,9);return{q:`${Ls} = ${t7L(m,e)}`,kL:K,kR:m,cL:q,cR:e}};
  const T=o.T??pick(r,["one","none","inf"]);
  if(v==="pick"){const form=()=>pick(r,["dist","comb"]);const E=make(T,form());const others=["one","none","inf"].filter(t=>t!==T);
    const bad=[...others,...others].map(t=>{const e=make(t,form());return[e.q,`This one has ${L[t].toLowerCase()}. Simplify both sides and compare.`]});
    return t7I("t7_numsol",o.lvl||"Challenge",`Which equation has <b>${L[T].toLowerCase()}</b>?`,E.q,bad,
      [stp(r,{p:"How can we tell how many solutions an equation has?",good:"Simplify each side, then compare the x terms and the numbers",bad:[["Count how many x's are written","How the equation is written doesn't matter until it's simplified."],["Check if the numbers are big","The size of the numbers doesn't decide it."]],t:"Different x coefficients → one solution. Same x coefficients and same numbers → infinitely many. Same x coefficients but different numbers → no solution."}),
       stp(r,{p:`So for ${L[T].toLowerCase()}, what should both sides look like after simplifying?`,good:T==="one"?"Different x coefficients":T==="inf"?"Exactly the same expression":"Same x coefficient, different number",bad:[[T==="one"?"Exactly the same expression":"Different x coefficients",T==="one"?"Identical sides would be true for every x.":"Different x coefficients give exactly one solution."],[T==="none"?"Exactly the same expression":"Same x coefficient, different number",T==="none"?"Identical sides would be true for every x.":"That would make a false statement like 3 = 5."]],t:"Distribute and combine like terms on each side of every choice, then check."})],r)}
  const E=make(T,v==="dist"?"dist":"comb");
  const opts=[L.one,L.none,L.inf].filter(x=>x!==L[T]).map(x=>[x,why[T][Object.keys(L).find(k=>L[k]===x)]]);
  if(T!=="one")opts.push(["One solution: x = 0",T==="inf"?"A true statement like 4 = 4 doesn't mean x = 0. It means every x works.":"A false statement doesn't mean x = 0. It means no x works."]);
  return t7I("t7_numsol",o.lvl||(v==="dist"?"Challenge":"Basic"),`How many solutions does this equation have?<br>${E.q}`,L[T],opts,
    [stp(r,{p:"What should we do first?",good:v==="dist"?"Distribute, so each side is simplified":"Combine like terms, so each side is simplified",bad:[["Guess a value for x","Testing one value can't show whether there are none or infinitely many."],["Divide both sides by x","Dividing by a variable can hide information."]],t:"Write each side as (number)x + (number).",a:"After simplifying, what is the x coefficient on the left side?",ans:E.kL}),
     stp(r,{p:`The left has ${T7(E.kL)} and the right has ${T7(E.kR)}. Subtract ${T7(E.kR)} from both sides. What is left?`,good:E.kL===E.kR?"No x terms: just a number = a number":"Some x is still left",bad:[[E.kL===E.kR?"Some x is still left":"No x terms: just a number = a number",`Compare ${E.kL} and ${E.kR} again.`],["Nothing at all","The numbers on each side are still there."]],t:"Matching x coefficients cancel completely. Different ones leave some x behind.",
       a:E.kL===E.kR?`What's left is ${fmt(E.cL)} = ${fmt(E.cR)}. Is that statement true?`:"Can we solve for one value of x now?",kind:"choice",opts:["Yes","No"],ans:E.kL===E.kR?(E.cL===E.cR?0:1):0})],r)},

t7_numsolk(r,o){const v=o.v||pick(r,VARS.t7_numsolk);const K=v=>"k = "+fmt(v);
  if(v==="inf"){const a=o.a??int(r,2,8),b=o.b??t7nz(r,-9,9),ab=a*b;

      [[K(b),`The ${a} multiplies the ${fmt(b)} too, so the right side needs ${a} × ${fmt(b)}.`],[K(a+b),"Distributing multiplies; it doesn't add."],[K(-ab),"Check the sign after you distribute."],[K(a),"k has to match the number term, not the x coefficient."]],

      [[K(d),`After distributing, the left number is ${a}k, so ${a}k must equal ${fmt(d)}.`],[K(d-a),`${a}(x + k) multiplies; it doesn't add ${a}.`],[K(-k),"Check the sign."],[K(a*d),`Undo multiplying by ${a} by dividing.`]],
      [stp(r,{p:"Distribute the left side. What does it become?",good:`${a}x + ${a}k`,bad:[[`${a}x + k`,`The ${a} multiplies k too.`],[`x + ${a}k`,`The ${a} multiplies x too.`]],t:"Every term inside gets multiplied by the number outside."}),
       stp(r,{p:`For the sides to be identical, ${a}k must equal what?`,good:fmt(d),bad:[[fmt(a),`${a} is the x coefficient, which already matches.`],["0","The number terms have to match each other."]],t:"Identical sides → same x coefficient AND same number term.",a:`${a}k = ${fmt(d)}, so k = ?`,ans:k})],r)}
  // none
  const a=o.a??int(r,2,9),b=o.b??int(r,-9,9);let c=o.c??int(r,-9,9);if(c===b)c=b+3;if(c===a||c===-a)c+=1;
  return t7I("t7_numsolk",o.lvl||"Challenge",`What value of k makes this equation have <b>no solution</b>?<br>${t7L(a,b)} = kx${c===0?"":(c<0?" − ":" + ")+Math.abs(c)}`,K(a),
    [[K(-a),"With that k, the x terms don't cancel, so there would be exactly one solution."],[K(c),"k is the x coefficient. Compare it to the other x coefficient, not the numbers."],[K(b===0||b===a||b===-a?a+1:b),"With that k, the x terms don't cancel, so there would be exactly one solution."],[K(0),"With k = 0 the right side has no x, so you could solve for exactly one x."]],
    [stp(r,{p:"When does a linear equation have no solution?",good:"The x terms cancel but the numbers don't match",bad:[["The x terms cancel and the numbers match","That's true for every x: infinitely many solutions."],["The x coefficients are different","Then you can always solve for one x."]],t:`Here the numbers are ${fmt(b)} and ${fmt(c)}, which don't match. So we only need the x terms to cancel.`,a:"What is the x coefficient on the left side?",ans:a})],r)},

// ===== 7-5 Compare proportional relationships =====
t7_compare(r,o){const v=o.v||pick(r,VARS.t7_compare);
  const ctx=v==="cheaper"?T7CTX[0]:v==="faster"?pick(r,[T7CTX[1],T7CTX[3]]):T7CTX[2];
  let uA=o.uA??pick(r,ctx.rates),uB=o.uB??pick(r,ctx.rates);while(uB===uA)uB=pick(r,ctx.rates);
  const kinds=shuffle(r,["table","eq","graph","desc"]);const [nA,nB]=ctx.names;const A=t7rep(r,kinds[0],ctx,nA,uA),B=t7rep(r,kinds[1],ctx,nB,uB);
  const q0=`${A.html}<br>${B.html}<br>`;
  const steps=[stp(r,{p:"How can we compare them fairly?",good:`Find each unit rate (the amount for 1 ${ctx.xu})`,bad:[["Compare the biggest numbers shown","The numbers are for different amounts, so they can't be compared directly."],["Add up all the numbers for each one","Totals don't tell the rate for 1 "+ctx.xu+"."]],t:`A unit rate is ${ctx.yu} ÷ ${ctx.xl.toLowerCase()}, the amount for exactly 1 ${ctx.xu}.`}),
    stp(r,{p:`How do we get ${nA}'s unit rate?`,good:kinds[0]==="eq"?"Read the number multiplying x":"Divide y by x for one pair",bad:[["Divide x by y","That gives "+ctx.xl.toLowerCase()+" per "+ctx.yu.replace(/s$/,"")+", the flipped rate."],["Subtract x from y","A rate compares by division."]],t:"For y = kx, k is the unit rate. For a point or a table pair, k = y ÷ x.",a:A.how,ans:uA}),
    stp(r,{p:`Same for ${nB}. What do we do?`,good:kinds[1]==="eq"?"Read the number multiplying x":"Divide y by x for one pair",bad:[["Divide x by y","That's the flipped rate."],["Use the biggest y-value","That's a total, not the amount for 1 "+ctx.xu+"."]],a:B.how,ans:uB})];
  if(v==="diff"){const d=RD(Math.abs(uA-uB)),hi=uA>uB?nA:nB;steps.push(stp(r,{p:`How much more per hour does ${hi} earn?`,good:"Subtract the smaller hourly rate from the larger one",bad:[["Add the two rates","“How much more” means find the difference."],["Divide the two rates","That tells how many times as much, not how much more."]],a:`${fmt(Math.max(uA,uB))} − ${fmt(Math.min(uA,uB))} = ?`,ans:d}));
    const F=x=>t7$(x)+" per hour";const totDiff=A.tot!=null&&B.tot!=null?Math.abs(A.tot-B.tot):null;
    return t7I("t7_compare",o.lvl||"Word",`${q0}Who earns more per hour, and how much more per hour?`,`${hi}, ${F(d)}`,
      [[`${hi}, ${F(RD(uA+uB))}`,"“How much more” means subtract the rates."],[`${hi===nA?nB:nA}, ${F(d)}`,"Compare the two unit rates again: who gets more for 1 hour?"],...(totDiff&&RD(totDiff)!==d?[[`${hi}, ${F(RD(totDiff))}`,"Those totals are for different numbers of hours. Compare rates for 1 hour."]]:[]),[`${hi}, ${F(Math.max(uA,uB))}`,"That's the hourly rate itself, not the difference."]],steps,r)}
  const better=(ctx.low?uA<uB:uA>uB)?nA:nB,ub=better===nA?uA:uB,worse=better===nA?nB:nA,uw=better===nA?uB:uA,Rb=better===nA?A:B;
  const bad=[[`${worse}: ${ctx.F(uw)}`,ctx.low?"That one costs more for each pound.":"That one goes less in each "+ctx.xu+"."],[`They are the same: ${ctx.F(ub)}`,"Work out both unit rates. They are different."]];
  if(t7ok(1/ub))bad.push([`${better}: ${ctx.F(RD(1/ub))}`,`That divides ${ctx.xl.toLowerCase()} by ${ctx.yu}, which flips the rate.`]);
  if(Rb.tot!=null&&Rb.tot!==ub)bad.push([`${better}: ${ctx.F(Rb.tot)}`,`That's a total for ${fmt(Rb.x0)} ${ctx.xu}s, not for 1 ${ctx.xu}.`]);
  bad.push([`${worse}: ${ctx.F(ub)}`,"Match each rate to the right name."]);
  return t7I("t7_compare",o.lvl||(v==="cheaper"?"Word":"Challenge"),`${q0}${v==="cheaper"?"Which store has the lower price per pound?":`Which is faster (more ${ctx.yu} per ${ctx.xu})?`}`,`${better}: ${ctx.F(ub)}`,bad,steps,r)},

t7_ratefrom(r,o){const v=o.v||pick(r,VARS.t7_ratefrom);const ctx=pick(r,T7CTX);const nm=pick(r,ctx.names);const u=o.u??pick(r,ctx.rates);
  const R=t7rep(r,v,ctx,nm,u);const F=ctx.F;
  const bad=[];if(t7ok(1/u))bad.push([F(RD(1/u)),`That divides ${ctx.xl.toLowerCase()} by ${ctx.yu}. The rate is ${ctx.yu} per ${ctx.xu}.`]);
  if(R.tot!=null)bad.push([F(R.tot),`That's the total for ${fmt(R.x0)} ${ctx.xu}s. Find the amount for 1 ${ctx.xu}.`]);
  if(v==="table"){const dy=RD(R.ys[1]-R.ys[0]);bad.push([F(dy),`That's the change between two columns, but x went up by ${R.xs[1]-R.xs[0]}, not 1.`]);bad.push([F(RD(u*R.xs[2]-u)),"Divide y by x; don't subtract."])}

t7_yintctx(r,o){const v=o.v||pick(r,VARS.t7_yintctx);const C=pick(r,T7LIN);const F0=pick(r,C.F),m=pick(r,C.m),M=C.dir*m,maxX=C.dir<0?Math.min(12,Math.floor((F0-1)/m)):12;

  const n=v==="cube"?6:pick(r,[4,5,8,10]);const e=t9events(r,n);

t9_theo2(r,o){const v=o.v||pick(r,VARS.t9_theo2);

  if(v==="word"){const ctx=pick(r,[["students in a class","student","play a sport","The teacher picks one student's name at random","the student plays a sport","the student does NOT play a sport"],["songs on a playlist","song","are pop songs","The player shuffles and picks one song at random","it is a pop song","it is NOT a pop song"],["books on a shelf","book","are mysteries","Ana grabs one book at random","it is a mystery","it is NOT a mystery"],["raffle tickets in a jar","ticket","are blue","One ticket is drawn at random","it is blue","it is NOT blue"]]);

      t9favTot(r,fav,T,neg?`That's ${T} − ${k}.`:""),r)}

// ===== 9-3 =====
t9_exper(r,o){const v=o.v||pick(r,VARS.t9_exper);
  if(v==="compare"){const m=int(r,3,15),N=6*m,x=int(r,1,6);let k=r()<0.15?m:m+pick(r,[-1,1])*int(r,1,Math.min(m-1,6));
    const good=k>m?"The experimental probability is greater":k<m?"The experimental probability is less":"They are equal";
    const all=[["The experimental probability is greater","Compare the two fractions with the same denominator."],["The experimental probability is less","Compare the two fractions with the same denominator."],["They are equal","Check: is the number of rolls the same as what you'd expect?"],["They can't be compared","Both are probabilities, so we can write them with the same bottom and compare."]].filter(z=>z[0]!==good);

        t:`In ${N} rolls we'd expect ${N} × 1/6 rolls of ${x}. Writing 1/6 with a bottom of ${N} makes them easy to compare.`,a:`1/6 = ?/${N}`,ans:m}),
       stp(r,{p:`Now compare ${k}/${N} with that fraction. What should we look at?`,good:"The tops, because the bottoms are the same",bad:[["The bottoms","They're both the same, so they can't tell us anything."],["Which number is written first","Order doesn't matter. Size does."]],t:"With the same bottom, the bigger top means the bigger probability."})],r)}
  const ctx=pick(r,[{t:"spinner with 4 equal sections (red, blue, green, yellow)",s:4,o:"blue",verb:"spun",lands:"Blue came up"},{t:"fair number cube",s:6,o:"a 5",verb:"rolled",lands:"A 5 came up"},{t:"fair coin",s:2,o:"heads",verb:"tossed",lands:"Heads came up"},{t:"spinner with 5 equal sections (A, B, C, D, E)",s:5,o:"section A",verb:"spun",lands:"Section A came up"}]);
  const n=pick(r,[20,25,30,40,50,60,80,100]);let k;do{k=int(r,Math.max(2,Math.round(n/ctx.s)-6),Math.round(n/ctx.s)+7)}while(k<1||k>=n||k*ctx.s===n||2*k===n);
  if(v==="predict"){const g=gcd(k,n),base=n/g,lo=Math.ceil((n+1)/base),N=base*int(r,lo,Math.max(lo+1,Math.floor(500/base)));const ans=N*k/n;
    return t9I("t9_exper","Word",`Zoe ${ctx.verb} a ${ctx.t} ${n} times. ${ctx.lands} ${k} times. Based on her results, about how many times should she expect to get ${ctx.o} in ${N} tries?`,fmt(ans),
      [[fmt(N-ans),`That predicts the times she does NOT get ${ctx.o}.`],[fmt(k+(N-n)),`That adds ${N-n} to the count. Predictions scale by multiplying, not adding.`],[fmt(N/ctx.s),"That uses the theoretical probability. The question says to use her results."],[fmt(k*N),`That forgets to divide by ${n}.`],[fmt(ans+k),`That adds the first ${k} on top. The ${N} tries are a fresh set, so just scale ${k}/${n} up.`]].filter(z=>Number.isInteger(t9val(z[0]))),
      [stp(r,{p:"What should we use for the prediction?",good:`The experimental probability, ${k}/${n}`,bad:[[`The theoretical probability, 1/${ctx.s}`,"The question says to base it on her results."],[`The count, ${k}`,"A count only makes sense for the same number of tries."]],
        t:`Expected count = probability × number of tries = ${k}/${n} × ${N}.${g>1?` Simplify first: ${k}/${n} = ${k/g}/${base}.`:""}`,a:`${N} ÷ ${base} = ?`,ans:N/base,h:`Divide ${N} into ${base} equal groups.`}),
       stp(r,{p:"What's the last step?",good:`Multiply that by ${k/g}`,bad:[[`Add ${k/g}`,"We need that many groups, so multiply."],["Stop here",`That's only one 1/${base} share of the tries.`]],a:`${fmt(N/base)} × ${k/g} = ?`,ans:ans})],r)}

    [[t9F(k,n-k),"That compares the hits to the misses. Divide by the total number of tries."],[t9F(n-k,n),`That's the experimental probability of NOT getting ${ctx.o}.`],[t9F(1,ctx.s),"That's the theoretical probability (what should happen). Experimental uses what actually happened."],[t9F(1,k),"The top should be how many times it happened."]],

t9_predict(r,o){const v=o.v||pick(r,VARS.t9_predict);

  if(v==="bag"){const b=t9bag(r,3,1,6);const i=int(r,0,2),c=b.cnt[i],T=b.T;const g=gcd(c,T),pd=T/g,pf=c/g;const N=pd*int(r,2,Math.max(2,Math.floor(300/pd)));const ans=N*c/T;
    return t9I("t9_predict","Challenge",`A bag holds ${t9list(b.cols,b.cnt,"marbles")}. You pick a marble, record its color, and put it back. You do this ${N} times. Predict how many times you will pick ${b.cols[i]}.`,fmt(ans),
      [[fmt(N-ans),`That predicts how many times you will NOT pick ${b.cols[i]}.`],[fmt(c),`That's how many ${b.cols[i]} marbles are in the bag, not a prediction for ${N} picks.`],...(N%3===0?[[fmt(N/3),"That treats each color as equally likely, but the counts are different."]]:[]),[fmt(N*c),`That forgets to divide by the total, ${T}.`]],
      [stp(r,{p:`First, what is P(${b.cols[i]})?`,good:`${b.cols[i]} marbles ÷ all marbles`,bad:[["1 ÷ number of colors","The colors have different counts, so they aren't equally likely."],[`${b.cols[i]} ÷ the other marbles`,"Divide by the total."]],t:`P(${b.cols[i]}) = ${c}/${T}${g>1?" = "+t9F(c,T):""}.`,a:"How many marbles are in the bag in all?",ans:T}),...steps(pf,pd,N,ans,t9F(c,T))],r)}
  const ctx=pick(r,[["Maya makes","of her free throws","She will shoot","free throws","will she make"],["A seed company says","of its sunflower seeds sprout","Ben plants","seeds","will sprout"],["A survey shows","of students at a school ride the bus","The school has","students","ride the bus"]]);
  const p=pick(r,[20,25,30,40,60,70,75,80,90]);const g=gcd(p,100),pd=100/g,pf=p/g;const N=pd*int(r,2,Math.max(2,Math.floor(ctx[3]==="students"?800/pd:100/pd)));const ans=N*p/100;

t9_model(r,o){const v=o.v||pick(r,VARS.t9_model);
  if(v==="sections"){const k=pick(r,[3,4]);let u;do{u=[];let left=12;for(let i=0;i<k-1;i++){const x=int(r,1,left-(k-1-i));u.push(x);left-=x}u.push(left)}while(u.some(x=>x<1)||new Set(u).size===1);
    const cols=shuffle(r,t9COL).slice(0,k);const i=int(r,0,k-1),deg=u[i]*30;
    const desc=cols.map((c,j)=>`${c} ${u[j]*30}°`).join(", ");
    return t9I("t9_model","Challenge",`A spinner is split into sections of different sizes: ${desc}. What is the probability the spinner lands on ${cols[i]}?`,t9F(u[i],12),
      [[t9F(1,k),`That assumes all ${k} sections are the same size. They aren't, so this model is not uniform.`],[t9F(12-u[i],12),`That's the probability of NOT landing on ${cols[i]}.`],[t9F(deg,360-deg),`That compares ${cols[i]} to the rest. Divide by the whole circle.`],...(deg<100?[[t9F(deg,100),"A full circle is 360°, not 100."]]:[])],
      [stp(r,{p:"The sections are different sizes. How do we find the probability?",good:"Divide the section's angle by the whole circle, 360°",bad:[[`Use 1/${k} because there are ${k} sections`,"That only works when every section is the same size."],["Divide the angle by 100","A full turn is 360°."]],
        t:`P(${cols[i]}) = ${deg}/360.`,a:`${deg}/360 simplified: what is the greatest common factor of ${deg} and 360?`,ans:gcd(deg,360),h:`Try the biggest number that divides ${deg} evenly and also divides 360.`})],r)}
  const U=[["Rolling a fair number cube and recording the number","Each of the 6 numbers has the same chance, so this model is uniform."],["Tossing a fair coin","Heads and tails have the same chance, so this model is uniform."],["Spinning a spinner with 5 equal sections","Equal sections means equal chances, so this model is uniform."],["Picking a card from 10 cards numbered 1 to 10","Each card has the same chance, so this model is uniform."],["Picking a letter tile from tiles A, B, C, and D (one of each)","Each tile has the same chance, so this model is uniform."]];
  const N=[["Picking a marble from a bag with 3 red and 7 blue marbles","There are more blue marbles than red ones, so the colors don't have equal chances."],["Spinning a spinner where red is half the circle and blue and green are each a quarter","Red takes up more of the spinner, so the colors don't have equal chances."],["Tossing two coins and recording how many heads","1 head can happen two ways (HT or TH), but 0 heads only one way, so the chances aren't equal."],["Rolling two number cubes and recording the sum","A sum of 7 can happen many ways but a sum of 2 only one way, so the chances aren't equal."],["Picking a letter at random from the word BANANA","There are three A's but only one B, so the letters don't have equal chances."]];

  if(v==="uniform"){const g=pick(r,U),b=shuffle(r,N).slice(0,3);return t9I("t9_model","Basic","Which situation has a <b>uniform</b> probability model?",g[0],b,[plan],r)}
  const g=pick(r,N),b=shuffle(r,U).slice(0,3);return t9I("t9_model","Basic","Which situation does <b>NOT</b> have a uniform probability model?",g[0],b,[plan],r)},

t9_modeldata(r,o){const v=o.v||pick(r,VARS.t9_modeldata);
  const ctx=pick(r,[["favorite lunch",["pizza","tacos","salad","pasta"]],["favorite sport",["soccer","basketball","swimming","tennis"]],["way to get to school",["bus","car","walk","bike"]],["favorite season",["summer","winter","spring","fall"]]]);
  const N=pick(r,[20,25,40,50]);let c;do{c=[int(r,1,N/2),int(r,1,N/2),int(r,1,N/2)];c.push(N-c[0]-c[1]-c[2])}while(c[3]<1||new Set(c).size<3);
  const i=int(r,0,3),k=c[i],cat=ctx[1][i];const tbl=ctx[1].map((x,j)=>`${x}: ${c[j]}`).join(" &nbsp;|&nbsp; ");

  if(v==="build")return t9I("t9_modeldata","Basic",q0+`Using these results as a probability model, what is the probability a randomly chosen student's answer is ${cat}?`,t9F(k,N),
    [["1/4","That assumes all four answers are equally likely. The survey shows they aren't."],[t9F(k,N-k),"That compares to the other answers only. Divide by everyone surveyed."],[t9F(N-k,N),`That's the probability the answer is NOT ${cat}.`],[t9F(1,k),"The top should be the number who chose it."]],
    t9favTot(r,k,N,`Read it from the table.`),r);
  const g=gcd(k,N),pd=N/g;const M=pd*int(r,Math.max(2,Math.ceil(100/pd)),Math.max(3,Math.floor(600/pd)));const ans=M*k/N;
  return t9I("t9_modeldata","Word",q0+`The school has ${M} students. Use the survey to predict how many students at the school would answer ${cat}.`,fmt(ans),
    [[fmt(M-ans),`That predicts how many would NOT answer ${cat}.`],...(M%4===0?[[fmt(M/4),"That assumes all four answers are equally popular, but the survey shows they aren't."]]:[]),[fmt(k+(M-N)),`That adds ${M-N}. Predictions scale by multiplying.`],[fmt(k*M),`That forgets to divide by ${N}.`]],
    [stp(r,{p:"What probability should we use?",good:`The survey result: ${k}/${N}`,bad:[["1/4, since there are 4 choices","The survey shows the choices aren't equally popular."],[`${k}/${M}`,`${k} students out of the ${N} surveyed gave that answer.`]],t:`Prediction = ${k}/${N} × ${M}.`,a:`${M} ÷ ${N} = ?`,ans:M/N,h:`How many times bigger is ${M} than ${N}?`}),
     stp(r,{p:"What's next?",good:`Multiply that by ${k}`,bad:[[`Add ${k}`,"Scaling up means multiplying."],["Stop here","That's only the scale factor."]],a:`${fmt(M/N)} × ${k} = ?`,ans:ans})],r)},

// ===== 9-5 =====
t9_count(r,o){const v=o.v||pick(r,VARS.t9_count);
  const plan=(list)=>stp(r,{p:"How can we count all the possible outcomes without listing them?",good:"Multiply the number of choices at each stage",bad:[["Add the number of choices","Adding counts single choices. Each choice in one group pairs with EVERY choice in the next, so multiply."],["Use the biggest group only","Every group adds more combinations."]],
    t:`This is the Fundamental Counting Principle. A tree diagram would branch ${list.join(", then ")} times.`,a:`${list.join(" × ")} = ?`,ans:list.reduce((a,b)=>a*b,1)});
  if(v==="outfit"){const ctx=pick(r,[["shirts","pants","pairs of shoes","an outfit (one of each)","Your closet has"],["sandwiches","drinks","desserts","a lunch special (one of each)","A deli offers"],["ice cream flavors","toppings","kinds of cones","an ice cream order (one of each)","An ice cream shop offers"],["crusts","sauces","toppings","a one-topping pizza","A pizza shop offers"]]);
    const a=int(r,2,6),b=int(r,2,5),c=int(r,2,4);
    return t9I("t9_count","Basic",`${ctx[4]} ${a} ${ctx[0]}, ${b} ${ctx[1]}, and ${c} ${ctx[2]}. How many different ways are there to choose ${ctx[3]}?`,fmt(a*b*c),
      [[fmt(a+b+c),"That adds the choices. Each choice pairs with every choice from the other groups, so multiply."],[fmt(a*b),`That leaves out the ${ctx[2]}.`],[fmt(a*b+c),`That adds the ${ctx[2]} at the end instead of multiplying.`]],[plan([a,b,c])],r)}
  if(v==="twoexp"){const E=[[2,"tossing a coin"],[6,"rolling a number cube"],[3,"spinning a spinner with 3 equal sections"],[4,"spinning a spinner with 4 equal sections"],[5,"picking a vowel (A, E, I, O, U)"],[7,"picking a day of the week"]];
    const [x,y]=shuffle(r,E).slice(0,2);
    return t9I("t9_count","Basic",`An experiment is ${x[1]} and ${y[1]}. How many outcomes are in the sample space?`,fmt(x[0]*y[0]),
      [[fmt(x[0]+y[0]),"That adds. Each outcome of the first part pairs with every outcome of the second, so multiply."],[fmt(Math.max(x[0],y[0])),"That counts only one part of the experiment."],[fmt(2*x[0]*y[0]),"That counts every pair twice. Each pair is one outcome."]],
      [plan([x[0],y[0]])],r)}
  // tree
  const k=int(r,3,5);const ctx=pick(r,[[`A coin is tossed ${k} times.`,"heads or tails"],[`A family has ${k} children.`,"boy or girl"],[`A quiz has ${k} true-or-false questions, and you guess on each.`,"true or false"]]);
  return t9I("t9_count","Challenge",`${ctx[0]} Each time there are 2 possible results (${ctx[1]}). How many outcomes are in the sample space (the number of branches at the end of a tree diagram)?`,fmt(2**k),
    [[fmt(2*k),`That adds 2 for each of the ${k} stages. Each branch splits into 2, so the count doubles each time.`],[fmt(k+1),"That counts the possible totals (like how many heads), not the different outcomes."],[fmt(2**(k+1)),"Count the stages again. The tree has one level for each stage."]],
    [stp(r,{p:"What happens to the number of branches at each new stage?",good:"Every branch splits into 2, so it doubles",bad:[["It goes up by 2","Each existing branch splits, so the total doubles."],["It stays the same","Each new stage creates new branches."]],t:`So the count is 2 × 2 × … with one 2 for each of the ${k} stages.`,a:`2<sup>${k}</sup> = ?`,ans:2**k})],r)},

t9_events(r,o){const v=o.v||pick(r,VARS.t9_events);

    [stp(r,{p:"How can we see every outcome?",good:`Make a ${n}-by-${n} table: first spin down the side, second spin across the top`,bad:[["Add the two spins","The question is about pairs of results, not totals."],["List only the different numbers on the spinner","Each outcome is a pair of spins."]],

      [s,stp(r,{p:"Now the top. How many outcomes match both?",good:`${e1.fav} × ${e2.fav}`,bad:[[`${e1.fav} + ${e2.fav}`,"Each red result pairs with every blue result, so multiply."],["Just 1","Many pairs can work."]],t:"Then simplify.",a:`${e1.fav} × ${e2.fav} = ?`,ans:e1.fav*e2.fav})],r)}

      [[t9F(a+b,n),"That adds the probabilities. For both to happen, multiply."],[t9F(a*b,2*n),"Multiply the bottoms too, not add them."],[t9F(a*b,n),`There are ${n} × ${n} outcomes for two spins.`],[t9F(a+b,2*n),"That adds tops and bottoms. Multiply instead."]],
      [s,stp(r,{p:"Now the top:",good:`${a} × ${b}`,bad:[[`${a} + ${b}`,"Multiply the tops."],[`${a} × ${n}`,`Use the ${cols[1]} count for the second spin.`]],t:"Then simplify if possible.",a:`${a} × ${b} = ?`,ans:a*b})],r)}

t9_replace(r,o){const v=o.v||pick(r,VARS.t9_replace);const a=int(r,2,6),b=int(r,2,7),T=a+b;const [c1,c2]=shuffle(r,t9COL).slice(0,2);

t9_sim(r,o){const v=o.v||pick(r,VARS.t9_sim);
  if(v==="tool"){const T=[["1/2","Toss a fair coin"],["1/6","Roll a fair number cube"],["1/4","Spin a spinner with 4 equal sections"],["1/3","Spin a spinner with 3 equal sections"],["1/10","Pick a random digit from 0 to 9"],["1/5","Spin a spinner with 5 equal sections"]];
