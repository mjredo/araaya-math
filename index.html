      [stp(r,{p:"First check: is anything impossible?",good:"No. The two angles add to less than 180°, so a third angle fits",bad:[["Yes, the angles are different sizes","Triangles can have different angles."]],t:"The third angle is whatever is left of 180°.",a:`180 − ${A} − ${B} = ?`,ans:180-A-B}),
       stp(r,{p:"Now picture drawing it. What happens?",good:`Draw the ${p} cm side, then draw each angle at its ends`,bad:[["Draw the angles anywhere","The angles sit at the two ends of the given side."]],t:"The two angle rays from the ends of the side cross at just one point.",a:"At how many points can the two rays cross?",ans:1})],r)}
  const A=int(r,25,140);
  return item("t10_tricount",o.lvl||"Basic",`A triangle has sides of ${p} cm and ${q} cm, and the angle <b>between</b> them is ${A}°. How many triangles are possible?`,O1,[[OM,"Both sides and the angle between them are set. Try drawing two different ones."],[O0,"Nothing breaks a triangle rule here. Any angle less than 180° can sit between two sides."]],
    [stp(r,{p:"First check: is anything impossible?",good:"No. Any angle under 180° can sit between two sides",bad:[["Yes, the sides are different lengths","Triangles can have sides of different lengths."]],t:`Draw the ${A}° angle. Measure ${p} cm along one ray and ${q} cm along the other.`}),
     stp(r,{p:"How do we finish the triangle?",good:"Connect the two ends with a straight line",bad:[["Choose any length for the third side","The two ends are already set, so the third side is too."]],t:"Two fixed points can be joined by a straight segment in only one way.",a:"How many ways can you connect the two ends?",ans:1})],r)},

t10_trisum(r,o){const v=o.v||pick(r,VARS.t10_trisum);
  if(v==="iso"){const vt=o.vt??int(r,10,70)*2,b=(180-vt)/2;
    return item("t10_trisum",o.lvl||"Challenge",`An isosceles triangle has a vertex angle of ${vt}°. The other two angles (the base angles) are equal. What is the measure of each base angle?`,`${b}°`,
      T10_nb([[180-vt,"That's both base angles together. Split it between the two equal angles."],[vt,"The vertex angle is the different one. The base angles are the two equal ones."],[(360-vt)/2,"Triangles use 180°, not 360°."]],"°"),
      [stp(r,{p:"What do we know about the angles?",good:"All three add to 180°, and the two base angles are equal",bad:[["All three angles are equal","That's an equilateral triangle."],["They add to 360°","360° is for quadrilaterals."]],t:"Take away the vertex angle; what's left is shared equally by the two base angles.",a:`180 − ${vt} = ?`,ans:180-vt}),
       stp(r,{p:"Now what?",good:"Divide by 2",bad:[["Subtract 2","Two equal angles share the total, so divide."],["Stop here","That's the total for both base angles."]],t:"Two equal angles share the leftover.",a:`${180-vt} ÷ 2 = ?`,ans:b})],r)}
  if(v==="expr"){const k=o.k??pick(r,[2,3]),lo=Math.ceil(120/(k+2)),hi=Math.floor(175/(k+2)),x=o.x??int(r,lo,hi),d=180-(k+2)*x;
    return item("t10_trisum",o.lvl||"Challenge",`The angles of a triangle measure x°, (x + ${d})°, and ${k}x°. What is the value of x?`,fmt(x),
      [[fmt(x+d),"That's the measure of the second angle. The question asks for x."],[fmt(k*x),"That's the measure of the third angle. The question asks for x."],[fmt(180-d),`After subtracting ${d}, divide by the number of x's.`],[fmt(180+d),"Subtract the constant from 180. Don't add it."]],
      [stp(r,{p:"What equation can we write?",good:`x + (x + ${d}) + ${k}x = 180`,bad:[[`x + (x + ${d}) + ${k}x = 360`,"360° is for quadrilaterals."],[`x + (x + ${d}) + ${k}x = 90`,"90° is a right angle, not the angle sum of a triangle."]],t:"The three angles of a triangle add to 180°. Combine the x terms first.",a:`x + x + ${k}x = ?x`,ans:k+2}),
       stp(r,{p:`${k+2}x + ${d} = 180. What's next?`,good:`Subtract ${d} from both sides`,bad:[[`Add ${d} to both sides`,"Do the opposite of + to undo it."],[`Divide by ${k+2} first`,"Undo the adding first, then the multiplying."]],t:`Undo the + ${d}.`,a:`180 − ${d} = ?`,ans:180-d}),
       stp(r,{p:`${k+2}x = ${180-d}. How do we finish?`,good:`Divide both sides by ${k+2}`,bad:[[`Subtract ${k+2}`,`${k+2}x means ${k+2} times x, so divide.`]],t:"Division undoes multiplication.",a:`${180-d} ÷ ${k+2} = ?`,ans:x})],r)}
  const a=o.a??int(r,25,100),b=o.b??int(r,25,155-a),c=180-a-b;const nm=pick(r,[["A","B","C"],["P","Q","R"],["X","Y","Z"]]);
  return item("t10_trisum",o.lvl||"Basic",`In triangle ${nm.join("")}, ∠${nm[0]} = ${a}° and ∠${nm[1]} = ${b}°. What is the measure of ∠${nm[2]}?`,`${c}°`,
    T10_nb([[360-a-b,"360° is for quadrilaterals. A triangle's angles add to 180°."],[a+b,"That's the two known angles added. Now subtract them from 180°."],[180-a,"Subtract both known angles, not just one."]],"°"),
    [stp(r,{p:"What do the three angles of a triangle add up to?",good:"180°",bad:[["360°","That's for a quadrilateral."],["90°","90° is one right angle."]],t:"Add the two angles we know.",a:`${a} + ${b} = ?`,ans:a+b}),
     stp(r,{p:"Now what?",good:"Subtract that from 180°",bad:[["Subtract it from 360°","Triangles use 180°."],["Add 180°","The missing angle is what's left over, so subtract."]],a:`180 − ${a+b} = ?`,ans:c})],r)},

// ---------- 10-4 Angle relationships ----------
t10_angpair(r,o){const v=o.v||pick(r,VARS.t10_angpair);
  if(v==="name"){const W=["Complementary","Supplementary","Vertical","Adjacent"];const WH={Complementary:"Complementary angles add up to exactly 90°.",Supplementary:"Supplementary angles add up to exactly 180°.",Vertical:"Vertical angles sit across from each other where two lines cross.",Adjacent:"Adjacent angles share a vertex and a side."};
    const k=o.k??pick(r,W);let q,a,b;
    if(k==="Complementary"){a=int(r,15,75);b=90-a;q=`∠P measures ${a}° and ∠Q measures ${b}°. They don't share a side. Which word describes ∠P and ∠Q?`}
    else if(k==="Supplementary"){a=int(r,20,160);if(a===90)a=110;b=180-a;q=`∠P measures ${a}° and ∠Q measures ${b}°. They don't share a side. Which word describes ∠P and ∠Q?`}
    else if(k==="Vertical"){q="Two straight lines cross at a point. ∠1 and ∠3 are across from each other at the crossing point and do not share a side. Which word describes ∠1 and ∠3?"}
    else{do{a=int(r,15,70);b=int(r,15,70)}while(a+b===90);q=`∠1 measures ${a}° and ∠2 measures ${b}°. They share a vertex and one side, and they don't overlap. Which word describes ∠1 and ∠2?`}
    const steps=[stp(r,{p:"What should we check?",good:a!=null?"Add the two measures and look at where the angles sit":"Look at where the angles sit",bad:[["Which angle is bigger","Size alone doesn't name a pair."],["Whether the angles are acute","Acute and obtuse describe one angle, not a pair."]],
      t:"Complementary: sum 90°. Supplementary: sum 180°. Vertical: across from each other at a crossing. Adjacent: share a vertex and a side.",a:a!=null?`${a} + ${b} = ?`:"Do ∠1 and ∠3 share a side?",kind:a!=null?"num":"choice",opts:a!=null?undefined:["Yes","No"],ans:a!=null?a+b:1})];
    return item("t10_angpair",o.lvl||"Basic",q,k,W.filter(x=>x!==k).map(x=>[x,WH[x]]),steps,r)}
  if(v==="vert"){let a=o.a??int(r,25,155);if(a===90)a=65;const askV=o.askV??r()<0.5,good=askV?a:180-a;
    return item("t10_angpair",o.lvl||"Basic",`Two straight lines cross. One of the four angles formed measures ${a}°. What is the measure of the angle that is <b>${askV?"vertical to it (directly across)":"adjacent to it (right next to it, on the same line)"}</b>?`,`${good}°`,
      T10_nb([[askV?180-a:a,askV?"That's the angle next to it. The angle directly across is a different one.":"That's the angle directly across. The one right next to it forms a straight line with it."],[90-a,"The lines don't make right angles here, so 90° isn't the total to use."],[360-a,"360° is the total of all four angles, not a pair."]],"°"),
      [stp(r,{p:askV?"What do we know about vertical angles?":"What do we know about adjacent angles on a straight line?",good:askV?"They are equal":"They add up to 180°",bad:askV?[["They add up to 180°","That's true for angles next to each other on a line."],["They add up to 90°","That's complementary angles."]]:[["They are equal","That's vertical angles, directly across."],["They add up to 90°","A straight line makes 180°."]],
        t:askV?"Vertical angles are always equal, because each one forms a straight line with the same neighbor.":"Two angles side by side on a straight line make a straight angle, 180°.",a:askV?null:`180 − ${a} = ?`,ans:askV?undefined:180-a})],r)}
  const comp=v==="comp";let a=o.a??(comp?int(r,12,78):int(r,25,165));if(!comp&&a===90)a=115;const S=comp?90:180,good=S-a;
  return item("t10_angpair",o.lvl||"Basic",`An angle measures ${a}°. What is the measure of its <b>${comp?"complement":"supplement"}</b>?`,`${good}°`,
    T10_nb([[comp?180-a:90-a,comp?"That's the supplement (adds to 180°). Complements add to 90°.":"That's the complement (adds to 90°). Supplements add to 180°."],[a,"That's the same angle. The question asks for the angle that pairs with it."],[comp?90+a:360-a,comp?"Subtract from 90°. Don't add.":"360° is a full turn. Supplements add to 180°."],[comp?360-a:180+a,"Use the right total and subtract."]],"°"),
    [stp(r,{p:`What do ${comp?"complementary":"supplementary"} angles add up to?`,good:`${S}°`,bad:[[`${comp?180:90}°`,comp?"That's supplementary angles.":"That's complementary angles."],["360°","That's a full turn."]],t:`Tip: “C” comes before “S”, and 90 comes before 180. Complementary → 90°, Supplementary → 180°.`,a:`${S} − ${a} = ?`,ans:good})],r)},

t10_anglex(r,o){const v=o.v||pick(r,VARS.t10_anglex);
  if(v==="vert"){let x,p,s,q,t,A;for(let i=0;i<300;i++){x=int(r,5,25);A=int(r,30,150);p=int(r,3,7);s=int(r,1,p-2);q=A-p*x;t=A-s*x;if(q>=-30&&q<=60&&t>=-30&&t<=80&&q!==0&&t!==0)break}
    if(!(q>=-30&&q<=60&&t>=-30&&t<=80&&q!==0&&t!==0)){x=10;p=3;s=1;q=20;t=40;A=50}
    const E1=T10_ex(p,q),E2=T10_ex(s,t),opts=[[A,"That's the angle's measure. The question asks for x."],[(180-q-t)/(p+s),"Vertical angles are equal. They don't add up to 180°."],[(t+q)/(p-s),"Subtract the constant on the left from both sides. Don't add it."],[t-q,`After getting ${p-s}x by itself, divide by ${p-s}.`]].filter(([v])=>Number.isInteger(v)&&v>0);
    return item("t10_anglex",o.lvl||"Challenge",`Two lines cross. A pair of vertical angles measure (${E1})° and (${E2})°. What is the value of x?`,fmt(x),opts.map(([v,w])=>[fmt(v),w]).concat([[fmt(x+p),"Check the steps: x-terms to one side, numbers to the other, then divide."]]),
      [stp(r,{p:"What equation can we write?",good:`${E1} = ${E2}`,bad:[[`${E1} + ${E2} = 180`,"That's for angles that make a straight line. These are vertical angles."],[`${E1} + ${E2} = 90`,"That's for complementary angles."]],t:`Vertical angles are equal. Get the x terms on one side: subtract ${s===1?"":s}x from both sides.`,a:`${p}x − ${s===1?"":s}x = ?x`,ans:p-s}),
       stp(r,{p:`${T10_ex(p-s,q)} = ${t}. What's next?`,good:q>0?`Subtract ${q} from both sides`:`Add ${-q} to both sides`,bad:[[q>0?`Add ${q} to both sides`:`Subtract ${-q} from both sides`,"Do the opposite operation to undo it."],[`Divide by ${p-s} first`,"Undo the adding or subtracting first."]],t:"Get the x term by itself.",a:`${t} ${q>0?"−":"+"} ${Math.abs(q)} = ?`,ans:t-q}),
       stp(r,{p:`${p-s===1?"":p-s}x = ${t-q}. How do we finish?`,good:p-s===1?"x is already alone":`Divide both sides by ${p-s}`,bad:[[`Subtract ${p-s}`,"Undo multiplication with division."]],a:"x = ?",ans:x})],r)}
  const comp=v==="comp",S=comp?90:180;let x,p,s,q,t,A1;
  for(let i=0;i<300;i++){x=int(r,4,20);A1=comp?int(r,20,70):int(r,40,140);p=int(r,1,5);s=int(r,1,5);q=A1-p*x;t=(S-A1)-s*x;if(q>=-20&&q<=50&&t>=-20&&t<=50&&q!==0&&t!==0)break}
  if(!(q>=-20&&q<=50&&t>=-20&&t<=50&&q!==0&&t!==0)){x=10;p=2;s=3;q=comp?10:30;t=comp?30:100;A1=p*x+q}
  const E1=T10_ex(p,q),E2=T10_ex(s,t),c=q+t,P=p+s;
  const opts=[[A1,"That's the measure of the first angle. The question asks for x."],[((comp?180:90)-c)/P,comp?"Complementary angles add up to 90°, not 180°.":"Angles that form a straight line add up to 180°, not 90°."],[(S+c)/P,"When you move the constant, subtract it from both sides."],[S-c,`After combining, divide by ${P}.`]].filter(([v])=>Number.isInteger(v)&&v>0);
  const q0=comp?`∠ABD and ∠DBC are complementary. ∠ABD = (${E1})° and ∠DBC = (${E2})°. What is the value of x?`:`Two angles form a straight line (they are supplementary). One measures (${E1})° and the other measures (${E2})°. What is the value of x?`;
  return item("t10_anglex",o.lvl||"Challenge",q0,fmt(x),opts.map(([v,w])=>[fmt(v),w]).concat([[fmt(x+P),"Check the steps: combine like terms, move the number, then divide."]]),
    [stp(r,{p:"What equation can we write?",good:`(${E1}) + (${E2}) = ${S}`,bad:[[`(${E1}) + (${E2}) = ${comp?180:90}`,comp?"Complementary angles add to 90°.":"A straight line is 180°."],[`${E1} = ${E2}`,"Setting them equal is for vertical angles."]],t:"Combine like terms: the x terms together and the numbers together.",a:`${p===1?"":p}x + ${s===1?"":s}x = ?x`,ans:P}),
     stp(r,{p:`${T10_ex(P,c)} = ${S}. What's next?`,good:c>0?`Subtract ${c} from both sides`:`Add ${-c} to both sides`,bad:[[c>0?`Add ${c} to both sides`:`Subtract ${-c} from both sides`,"Do the opposite operation to undo it."],[`Divide by ${P} first`,"Undo the adding or subtracting first."]],t:"Get the x term by itself.",a:`${S} ${c>0?"−":"+"} ${Math.abs(c)} = ?`,ans:S-c}),
     stp(r,{p:`${P}x = ${S-c}. How do we finish?`,good:`Divide both sides by ${P}`,bad:[[`Subtract ${P}`,"Undo multiplication with division."]],a:`${S-c} ÷ ${P} = ?`,ans:x})],r)},

// ---------- 10-5 Circumference ----------
t10_circum(r,o){const v=o.v||pick(r,VARS.t10_circum);const u=pick(r,["cm","in","m","ft"]);
  if(v==="find"){const d=o.d??int(r,2,15)*2,C=T10_R(3.14*d),askR=o.askR??r()<0.5,good=askR?d/2:d;
    return item("t10_circum",o.lvl||"Challenge",`A circle has a circumference of ${fmt(C)} ${u}. What is its <b>${askR?"radius":"diameter"}</b>? ${T10_PI}`,`${fmt(good)} ${u}`,
      T10_nb([[askR?d:d/2,askR?"That's the diameter. The radius is half of it.":"That's the radius. The diameter is twice as long."],[C*3.14,"That multiplies by π. To undo C = πd, divide by π."],[C-3.14,"Subtracting doesn't undo multiplying. Divide by 3.14."],[askR?d*2:d*2,"Check: C = π × d, so d = C ÷ π."]]," "+u),
      [stp(r,{p:"C = πd. How do we find d from C?",good:"Divide the circumference by 3.14",bad:[["Multiply the circumference by 3.14","That would make it bigger. Undo multiplying with dividing."],["Subtract 3.14","C is π TIMES d, so divide."]],t:`${fmt(C)} = 3.14 × d, so d = ${fmt(C)} ÷ 3.14.`,a:`${fmt(C)} ÷ 3.14 = ?`,ans:d})].concat(askR?[stp(r,{p:"That's the diameter. What do we need?",good:"Half of it, the radius",bad:[["Double it","The radius is shorter than the diameter."]],a:`${d} ÷ 2 = ?`,ans:d/2})]:[]),r)}
  if(v==="fromd"){const d=o.d??int(r,3,30),C=T10_R(3.14*d);
    return item("t10_circum",o.lvl||"Basic",`A circle has a diameter of ${d} ${u}. Find its circumference. ${T10_PI}`,`${T10_F(C)} ${u}`,
      T10_nb([[6.28*d,"That doubles the diameter. C = πd already uses the whole diameter."],[3.14*(d/2)*(d/2),"That's the area formula (πr²), not the distance around."],[3.14*d/2,"That's only half the circle."]]," "+u),
      [T10_planCirc(r,0),stp(r,{p:"We have the diameter. What do we do?",good:"Multiply the diameter by 3.14",bad:[["Multiply the diameter by 2 first","Doubling is only needed when you start with the radius."],["Square the diameter","Squaring is for area."]],a:`3.14 × ${d} = ?`,ans:C})],r)}
  const rad=o.rad??int(r,2,20),C=T10_R(6.28*rad);
  return item("t10_circum",o.lvl||"Basic",`A circle has a radius of ${rad} ${u}. Find its circumference. ${T10_PI}`,`${T10_F(C)} ${u}`,
    T10_nb([[3.14*rad,"That uses the radius as if it were the diameter. The diameter is 2 × the radius."],[3.14*rad*rad,"That's the area formula (πr²), not the distance around."],[12.56*rad,"You doubled twice. C = 2πr doubles the radius only once."]]," "+u),
    [T10_planCirc(r,rad),stp(r,{p:`The diameter is ${2*rad}. What next?`,good:"Multiply the diameter by 3.14",bad:[["Square it","Squaring is for area."],["Add 3.14","π multiplies the diameter."]],a:`3.14 × ${2*rad} = ?`,ans:C})],r)},

t10_circword(r,o){const v=o.v||pick(r,VARS.t10_circword);
  if(v==="rot"){const d=o.d??pick(r,[1,2,3]),n=o.n??int(r,10,50),D=T10_R(3.14*d*n);
    return item("t10_circword",o.lvl||"Word",`A wheel with a diameter of ${d} ft rolls in a straight line for ${fmt(D)} ft. How many full turns does the wheel make? ${T10_PI}`,`${n} turns`,
      T10_nb([[D/d,"That divides by the diameter only. One turn covers π × d, so divide by 3.14 × d."],[2*n,"That uses the radius in place of the diameter. One turn rolls the full circumference."],[D/(6.28*d),"That doubles the diameter. One turn is π × d."]]," turns"),
      [stp(r,{p:"How far does the wheel roll in ONE turn?",good:"One circumference: π × diameter",bad:[["One diameter","In one turn, the whole edge of the wheel touches the ground."],["One radius","In one turn, the whole edge of the wheel touches the ground."]],t:"As the wheel turns once, its whole edge (the circumference) rolls along the ground.",a:`3.14 × ${d} = ?`,ans:T10_R(3.14*d)}),
       stp(r,{p:"How do we get the number of turns?",good:"Divide the total distance by the distance of one turn",bad:[["Multiply the total distance by one turn","That gives a huge number, not a count."],["Subtract","Subtracting doesn't count groups."]],t:"How many one-turn distances fit into the total?",a:`${fmt(D)} ÷ ${fmt(T10_R(3.14*d))} = ?`,ans:n})],r)}
  if(v==="semi"){const d=o.d??int(r,2,10),arc=T10_R(1.57*d),tot=T10_R(arc+d);
    return item("t10_circword",o.lvl||"Challenge",`A window is shaped like a semicircle (half a circle) with a diameter of ${d} ft. Trim goes all the way around its edge: the curved part AND the straight bottom. How many feet of trim are needed? ${T10_PI}`,`${T10_F(tot)} ft`,
      T10_nb([[arc,"That's only the curved part. The straight bottom edge needs trim too."],[3.14*d+d,"That uses the whole circle's curve. A semicircle has half of it."],[3.14*d,"That's the full circle's circumference with no straight edge."]]," ft"),
      [stp(r,{p:"What are the parts of the edge?",good:"Half of a circumference, plus the straight diameter",bad:[["A full circumference","The window is only half a circle."],["Just the curved part","The question says the straight bottom gets trim too."]],t:"Curved part = (3.14 × d) ÷ 2. Straight part = d.",a:`(3.14 × ${d}) ÷ 2 = ?`,ans:arc}),
       stp(r,{p:"Now what?",good:`Add the straight edge, ${d} ft`,bad:[["Double it","That would be a full circle with no straight edge."],["Stop here","The bottom edge still needs trim."]],a:`${T10_F(arc)} + ${d} = ?`,ans:tot})],r)}
  const d=o.d??pick(r,[20,24,26,28]),n=o.n??int(r,5,20),one=T10_R(3.14*d),D=T10_R(one*n);
  return item("t10_circword",o.lvl||"Word",`A bicycle wheel has a diameter of ${d} inches. How far does the bike travel when the wheel turns ${n} times? ${T10_PI}`,`${T10_F(D)} in`,
    T10_nb([[one,"That's just one turn of the wheel."],[6.28*d*n,"That treats the diameter like a radius. C = π × d."],[d*n,"One turn rolls the whole circumference, not just the diameter."]]," in"),
    [stp(r,{p:"How far does the bike go in ONE turn of the wheel?",good:"One circumference: 3.14 × diameter",bad:[["One diameter","In one turn, the whole edge of the wheel touches the ground."],["One radius","In one turn, the whole edge of the wheel touches the ground."]],t:"In one turn the whole edge of the wheel rolls along the ground.",a:`3.14 × ${d} = ?`,ans:one}),
     stp(r,{p:`The wheel turns ${n} times. Now what?`,good:`Multiply by ${n}`,bad:[[`Divide by ${n}`,"More turns means farther, so multiply."],[`Add ${n}`,"Each turn adds a whole circumference."]],a:`${T10_F(one)} × ${n} = ?`,ans:D})],r)},

// ---------- 10-6 Area of a circle ----------
t10_carea(r,o){const v=o.v||pick(r,VARS.t10_carea);const u=pick(r,["cm","in","m","ft"]),U=` ${u}<sup>2</sup>`;
  if(v==="semi"){const d=o.d??int(r,2,12)*2,rad=d/2,A=T10_R(1.57*rad*rad);
    return item("t10_carea",o.lvl||"Challenge",`Find the area of a semicircle (half a circle) with a diameter of ${d} ${u}. ${T10_PI}`,T10_F(A)+U,
      T10_nb([[1.57*d*d,"That uses the diameter as the radius. Halve the diameter first."],[3.14*rad*rad,"That's the whole circle. A semicircle is half."],[1.57*d,"That's half the circumference, a length, not an area."]],U),
      [T10_planArea(r),stp(r,{p:`The diameter is ${d}. What's the radius?`,good:`Half of ${d}`,bad:[[`${d} itself`,"The radius goes from the center to the edge, half the diameter."],[`${d} × 2`,"The radius is shorter than the diameter."]],a:`${d} ÷ 2 = ?`,ans:rad}),
       stp(r,{p:"Whole-circle area, then…?",good:"Divide it by 2",bad:[["Keep the whole circle","The shape is only half a circle."],["Multiply by 2","Half a circle has less area."]],t:`Whole circle: 3.14 × ${rad} × ${rad} = ${T10_F(3.14*rad*rad)}.`,a:`${T10_F(3.14*rad*rad)} ÷ 2 = ?`,ans:A})],r)}
  if(v==="fromd"){const d=o.d??int(r,2,12)*2,rad=d/2,A=T10_R(3.14*rad*rad);
    return item("t10_carea",o.lvl||"Basic",`A circle has a diameter of ${d} ${u}. Find its area. ${T10_PI}`,T10_F(A)+U,
      T10_nb([[3.14*d*d,"That squares the diameter. The formula uses the radius, half the diameter."],[3.14*d,"That's the circumference, the distance around."],[1.57*d*d,"Halve the diameter BEFORE squaring, not after."]],U),
      [T10_planArea(r),stp(r,{p:"We were given the diameter. What first?",good:"Find the radius: half the diameter",bad:[["Square the diameter","Area squares the radius."],["Double the diameter","The radius is half the diameter."]],a:`${d} ÷ 2 = ?`,ans:rad}),
       stp(r,{p:"Now use A = πr². What do we compute?",good:`3.14 × ${rad} × ${rad}`,bad:[[`3.14 × ${rad} × 2`,"r² means r × r, not r × 2."],[`3.14 × ${d} × ${d}`,"Use the radius."]],a:`3.14 × ${rad} × ${rad} = ?`,ans:A})],r)}
  const rad=o.rad??int(r,3,15),A=T10_R(3.14*rad*rad);
  return item("t10_carea",o.lvl||"Basic",`A circle has a radius of ${rad} ${u}. Find its area. ${T10_PI}`,T10_F(A)+U,
    T10_nb([[6.28*rad,"That's the circumference (2πr). Area is π × r × r."],[3.14*rad,"The radius has to be squared."],[3.14*4*rad*rad,"That squares the diameter. The formula uses the radius."]],U),
    [T10_planArea(r),stp(r,{p:`What is ${pw("r",2)} here?`,good:`${rad} × ${rad}`,bad:[[`${rad} × 2`,"The little 2 means multiply r by itself."],[`${rad} + ${rad}`,"Squaring is multiplying, not adding."]],a:`${rad} × ${rad} = ?`,ans:rad*rad}),
     stp(r,{p:"Last step?",good:`Multiply by 3.14`,bad:[["Divide by 3.14","A = π × r², so multiply."],["Multiply by 2","There's no extra 2 in the area formula."]],a:`3.14 × ${rad*rad} = ?`,ans:A})],r)},

t10_careaword(r,o){const v=o.v||pick(r,VARS.t10_careaword);
  if(v==="pizza"){let d1,d2;do{d1=pick(r,[8,10,12,14]);d2=pick(r,[12,14,16,18])}while(d2<=d1);const r1=d1/2,r2=d2/2,A1=T10_R(3.14*r1*r1),A2=T10_R(3.14*r2*r2),diff=T10_R(A2-A1);
    return item("t10_careaword",o.lvl||"Word",`How much more pizza (area) does ${d2===18?"an":"a"} ${d2}-inch pizza have than a ${d1}-inch pizza? Pizza sizes are diameters. ${T10_PI}`,`${T10_F(diff)} in<sup>2</sup>`,
      T10_nb([[3.14*(r2-r1)*(r2-r1),"Subtract the two AREAS, not the radii first."],[3.14*(d2*d2-d1*d1),"Pizza sizes are diameters. Use the radius in A = πr²."],[3.14*(d2-d1),"That's the difference in circumference (crust length), not area."]]," in<sup>2</sup>"),
      [stp(r,{p:"What's the plan?",good:"Find each pizza's area, then subtract",bad:[["Subtract the diameters, then find one area","Area doesn't grow evenly with the diameter, so that doesn't work."],["Compare the circumferences","Circumference measures the crust, not the pizza."]],t:`Radii: ${d2} ÷ 2 = ${r2} and ${d1} ÷ 2 = ${r1}.`,a:`Big pizza: 3.14 × ${r2} × ${r2} = ?`,ans:A2}),
       stp(r,{p:"And the small pizza?",good:`3.14 × ${r1} × ${r1}`,bad:[[`3.14 × ${d1} × ${d1}`,"Use the radius."]],a:`3.14 × ${r1} × ${r1} = ?`,ans:A1}),
       stp(r,{p:"How much more?",good:"Subtract: big − small",bad:[["Add them","“How much more” means subtract."],["Divide them","That tells how many times as big."]],a:`${T10_F(A2)} − ${T10_F(A1)} = ?`,ans:diff})],r)}
  if(v==="fromC"){const d=o.d??int(r,3,10)*2,rad=d/2,C=T10_R(3.14*d),A=T10_R(3.14*rad*rad);
    return item("t10_careaword",o.lvl||"Challenge",`A circular rug has a circumference of ${fmt(C)} ft. What is its area? ${T10_PI}`,`${T10_F(A)} ft<sup>2</sup>`,
      T10_nb([[3.14*d*d,"That uses the diameter in A = πr². Use the radius."],[3.14*rad,"The radius has to be squared."],[C,"That's the circumference, the distance around, not the area."]]," ft<sup>2</sup>"),
      [stp(r,{p:"We know C but need r. What first?",good:"Find the diameter: C ÷ 3.14",bad:[["Square the circumference","The circumference is a length around. We need the radius."],["Multiply C by 3.14","C = πd, so undo it by dividing."]],a:`${fmt(C)} ÷ 3.14 = ?`,ans:d}),
       stp(r,{p:"Now we have the diameter. Next?",good:"Halve it to get the radius",bad:[["Square it","Area squares the radius."]],a:`${d} ÷ 2 = ?`,ans:rad}),
       stp(r,{p:"Now the area?",good:`3.14 × ${rad} × ${rad}`,bad:[[`3.14 × ${rad} × 2`,"r² means r × r."]],a:`3.14 × ${rad} × ${rad} = ?`,ans:A})],r)}
  const rad=o.rad??int(r,5,20),A=T10_R(3.14*rad*rad);
  return item("t10_careaword",o.lvl||"Word",`A lawn sprinkler sprays water ${rad} ft in every direction as it turns in a full circle. How much area of lawn does it water? ${T10_PI}`,`${T10_F(A)} ft<sup>2</sup>`,
    T10_nb([[6.28*rad,"That's the distance around the circle, not the area inside."],[3.14*rad,"The radius has to be squared."],[3.14*4*rad*rad,`${rad} ft is the radius (center to edge). Don't double it first.`]]," ft<sup>2</sup>"),
    [stp(r,{p:`Is ${rad} ft the radius or the diameter?`,good:"The radius: it goes from the center out to the edge",bad:[["The diameter","The water goes from the sprinkler (the center) to the edge, which is a radius."]],t:"The sprinkler is the center of the circle."}),
     T10_planArea(r),stp(r,{p:"Compute?",good:`3.14 × ${rad} × ${rad}`,bad:[[`3.14 × ${rad} × 2`,"r² means r × r."]],a:`3.14 × ${rad} × ${rad} = ?`,ans:A})],r)},

// ---------- 10-7 Cross sections ----------
t10_cross(r,o){const v=o.v||pick(r,VARS.t10_cross);const l=int(r,6,12),w=int(r,2,l-2),h=int(r,3,9);
  const COPY="An exact copy of the base shape",SMALL="A smaller copy of the base shape",SIDE="A cut straight down shows the side view of the solid";
  const C={prism:[
    [`A rectangular prism has a ${l} cm by ${w} cm base. It is sliced <b>parallel</b> to its base. What is the shape of the cross section?`,`A ${l} cm by ${w} cm rectangle`,[["A rectangle smaller than the base","A prism's walls go straight up, so every parallel slice is the same size as the base."],["A triangle","A triangle needs slanted sides that meet at a point."],["A circle","A box has flat faces and straight edges, so the slice has straight sides."]],COPY,"Rectangle"],
    [`A rectangular prism is ${l} cm long, ${w} cm wide, and ${h} cm tall. It is sliced <b>perpendicular</b> to its base, parallel to the ${l} cm by ${h} cm side face. What is the shape of the cross section?`,`A ${l} cm by ${h} cm rectangle`,[[`A ${l} cm by ${w} cm rectangle`,"That's the shape of a slice parallel to the base."],[`A ${w} cm by ${h} cm rectangle`,"That slice would be parallel to the other side face."],["A triangle","A box's sides go straight up, so a vertical slice has 4 square corners."]],SIDE,"Rectangle"],
    ["A triangular prism (like a tent or a slice of cheese) is sliced <b>parallel</b> to its triangular bases. What is the shape of the cross section?","A triangle the same size as the bases",[["A rectangle","A rectangle comes from slicing the other way, parallel to a side face."],["A smaller triangle","A prism doesn't narrow, so parallel slices don't shrink."],["A circle","A prism has only flat faces and straight edges."]],COPY,"Triangle"],
    ["A triangular prism lies on one of its rectangular faces. It is sliced <b>parallel</b> to that rectangular face (so the cut runs the long way, perpendicular to the triangle bases). What is the shape of the cross section?","A rectangle",[["A triangle","A triangle comes from slicing parallel to the triangular bases."],["A circle","A prism has only flat faces and straight edges."],["A trapezoid","The prism's ends are straight, so the slice has square corners."]],SIDE,"Triangle"]],
   pyramid:[
    ["A square pyramid is sliced <b>parallel</b> to its base, halfway up. What is the shape of the cross section?","A square smaller than the base",[["A triangle","A triangle comes from a vertical slice through the top point."],["A square the same size as the base","A pyramid narrows toward the top, so the slice shrinks."],["A rectangle that is not a square","A parallel slice has the same shape as the square base."]],SMALL,"Square"],
    ["A square pyramid is sliced <b>perpendicular</b> to its base, straight down through its top point (the vertex). What is the shape of the cross section?","A triangle",[["A square","A square comes from a slice parallel to the base."],["A trapezoid","A trapezoid comes from a vertical slice that misses the top point."],["A circle","A pyramid has only flat faces and straight edges."]],SIDE,"Square"],
    ["A square pyramid is sliced <b>perpendicular</b> to its base, but the cut does NOT pass through the top point. What is the shape of the cross section?","A trapezoid",[["A triangle","A triangle needs the cut to pass through the top point."],["A square","A square comes from a slice parallel to the base."],["A rectangle","The pyramid's faces slant inward, so the top edge of the slice is shorter than the bottom edge."]],SIDE,"Square"]],
   round:[
    ["A cylinder (like a can) is sliced <b>parallel</b> to its base. What is the shape of the cross section?","A circle the same size as the base",[["A rectangle","A rectangle comes from a vertical slice."],["A smaller circle","A cylinder's sides go straight up, so the slices don't shrink."],["An oval","An oval comes from a tilted slice."]],COPY,"Circle"],
    ["A cylinder is sliced <b>perpendicular</b> to its base, straight down through the center. What is the shape of the cross section?","A rectangle",[["A circle","A circle comes from a slice parallel to the base."],["A triangle","A triangle needs a pointed top, like a cone."],["A trapezoid","A cylinder's sides go straight up, not slanted."]],SIDE,"Circle"],
    ["A cone is sliced <b>parallel</b> to its base. What is the shape of the cross section?","A circle smaller than the base",[["A triangle","A triangle comes from a vertical slice through the tip."],["A circle the same size as the base","A cone narrows toward its tip, so the slice shrinks."],["A rectangle","A cone has a curved side and no straight up-and-down edges."]],SMALL,"Circle"],
    ["A cone is sliced <b>perpendicular</b> to its base, straight down through its tip. What is the shape of the cross section?","A triangle",[["A circle","A circle comes from a slice parallel to the base."],["A rectangle","A cone's side slants in to a point."],["A square","A cone's base is round, and its side slants to a point."]],SIDE,"Circle"]]};
  const list=C[v],cs=list[o.c??int(r,0,list.length-1)];
  const pw2={[COPY]:"That's for slices parallel to the base of a solid whose walls go straight up.",[SMALL]:"That's for slices parallel to the base of a solid that narrows to a point.",[SIDE]:"That's for slices perpendicular to the base."};
  return item("t10_cross",o.lvl||"Basic",cs[0],cs[1],cs[2],
    [stp(r,{p:"Which rule fits this slice?",good:cs[3],bad:[COPY,SMALL,SIDE].filter(x=>x!==cs[3]).map(x=>[x,pw2[x]]),
      t:"Parallel to the base: prisms and cylinders give an exact copy of the base; pyramids and cones give a smaller copy. Perpendicular: you see the solid's side view.",a:"What shape is the base of this solid?",kind:"choice",opts:["Rectangle","Square","Triangle","Circle"],ans:["Rectangle","Square","Triangle","Circle"].indexOf(cs[4])})],r)},

// ---------- 10-8 Surface area ----------
t10_surf(r,o){const v=o.v||pick(r,VARS.t10_surf);const u=pick(r,["cm","in","ft"]),U=` ${u}<sup>2</sup>`;
  if(v==="tri"){const tr=pick(r,[[3,4,5],[6,8,10],[5,12,13],[9,12,15]]),[a,b,c]=tr,L=o.L??int(r,4,15),P=a+b+c,SA=a*b+P*L;
    return item("t10_surf",o.lvl||"Challenge",`A triangular prism has right-triangle bases with legs ${a} ${u} and ${b} ${u} and a longest side (hypotenuse) of ${c} ${u}. The prism is ${L} ${u} long. Find its total surface area.`,fmt(SA)+U,
      T10_nb([[2*a*b+P*L,"Each triangle's area is ½ × base × height. Don't forget the ½."],[P*L,"That's only the 3 rectangles. Add the 2 triangle bases."],[a*b/2*L,"That's the volume (space inside), not the surface area."]],U),
      [stp(r,{p:"What faces does the net have?",good:"2 triangles and 3 rectangles",bad:[["6 rectangles","That's a rectangular prism."],["1 triangle and 3 rectangles","A prism has two matching bases."]],t:`Each triangle: ½ × ${a} × ${b}. There are two, so together they make ${a} × ${b}.`,a:`Two triangles: 2 × ½ × ${a} × ${b} = ?`,ans:a*b}),
       stp(r,{p:"How can we get all 3 rectangles at once?",good:`Perimeter of the triangle × the length ${L}`,bad:[[`Multiply ${a} × ${b} × ${L}`,"That gives volume."],[`Use only the side ${c}`,"There are 3 different rectangles, one for each side of the triangle."]],t:`Rectangles: ${a} × ${L}, ${b} × ${L}, ${c} × ${L}. Together: (${a} + ${b} + ${c}) × ${L}.`,a:`${P} × ${L} = ?`,ans:P*L}),
       stp(r,{p:"Last step?",good:"Add the triangles and the rectangles",bad:[["Multiply them","Surface area adds the areas of all the faces."]],a:`${a*b} + ${P*L} = ?`,ans:SA})],r)}
  if(v==="pyr"){const s=o.s??int(r,3,12),sl=o.sl??int(r,Math.ceil(s/2)+1,s+8),SA=s*s+2*s*sl;
    return item("t10_surf",o.lvl||"Challenge",`A square pyramid has a base with sides of ${s} ${u}. Each triangular face has a slant height of ${sl} ${u}. Find the total surface area.`,fmt(SA)+U,
      T10_nb([[s*s+4*s*sl,"Each triangle is ½ × base × height. Don't forget the ½."],[2*s*sl,"That's only the 4 triangles. Add the square base too."],[s*s+s*sl,"There are 4 triangle faces, not 2."]],U),
      [stp(r,{p:"What faces make up the net?",good:"1 square base and 4 matching triangles",bad:[["2 squares and 4 triangles","A pyramid has only one base."],["1 square and 3 triangles","A square base has 4 edges, so 4 triangles."]],a:`Base: ${s} × ${s} = ?`,ans:s*s}),
       stp(r,{p:"Area of ONE triangle face?",good:`½ × ${s} × ${sl}`,bad:[[`${s} × ${sl}`,"A triangle is half of a rectangle."],[`½ × ${s} × ${s}`,"The triangle's height is the slant height."]],a:`½ × ${s} × ${sl} = ?`,ans:s*sl/2}),
       stp(r,{p:"Now?",good:"4 triangles plus the base",bad:[["2 triangles plus the base","There are 4 triangles."],["4 triangles only","Include the base."]],a:`4 × ${fmt(s*sl/2)} + ${s*s} = ?`,ans:SA})],r)}
  const L=o.l??int(r,3,12),W=o.w??int(r,2,10),H=o.h??int(r,2,10),sum=L*W+L*H+W*H,SA=2*sum;
  return item("t10_surf",o.lvl||"Basic",`A rectangular prism is ${L} ${u} long, ${W} ${u} wide, and ${H} ${u} tall. Find its total surface area.`,fmt(SA)+U,
    T10_nb([[L*W*H,"That's the volume (space inside), not the area of the faces."],[sum,"That counts only 3 faces. Each face has a matching one on the other side."],[2*(L+W)*H,"That's only the 4 side faces. Add the top and bottom."],[2*L*W+L*H+W*H,"Only the top and bottom were doubled. Every face has a matching partner."]],U),
    [stp(r,{p:"A rectangular prism has 6 faces. What's a quick plan?",good:"Find the 3 different face areas, add them, then double",bad:[["Multiply length × width × height","That's volume."],["Find one face and multiply by 6","Only a cube has 6 matching faces."]],t:`Faces: ${L} × ${W} (top/bottom), ${L} × ${H} (front/back), ${W} × ${H} (left/right).`,a:`${L}×${W} + ${L}×${H} + ${W}×${H} = ?`,ans:sum}),
     stp(r,{p:"Now?",good:"Double it, because each face has a matching partner",bad:[["Stop here","That's only half of the faces."],["Multiply by 6","We already added 3 different faces. Each has one partner."]],a:`2 × ${sum} = ?`,ans:SA})],r)},

t10_lateral(r,o){const v=o.v||pick(r,VARS.t10_lateral);
  if(v==="tent"){const s=o.s??int(r,5,10),sl=o.sl??int(r,s-1,s+4),lat=2*s*sl;
    return item("t10_lateral",o.lvl||"Word",`A tent is shaped like a square pyramid with no floor. The base is ${s} ft on each side and each triangular side has a slant height of ${sl} ft. How much fabric is needed for the 4 sides?`,`${lat} ft<sup>2</sup>`,
      T10_nb([[s*s+lat,"The tent has no floor, so don't add the square base."],[4*s*sl,"Each triangle is ½ × base × height. Don't forget the ½."],[s*sl,"There are 4 triangles, not 2."]]," ft<sup>2</sup>"),
      [stp(r,{p:"Which faces need fabric?",good:"Only the 4 triangles",bad:[["The 4 triangles and the square base","The tent has no floor."],["Only 1 triangle","All 4 sides need fabric."]],a:`One triangle: ½ × ${s} × ${sl} = ?`,ans:s*sl/2}),
       stp(r,{p:"Now?",good:"Multiply by 4",bad:[["Multiply by 2","There are 4 sides."],["Add the base","No floor."]],a:`4 × ${fmt(s*sl/2)} = ?`,ans:lat})],r)}
  const walls=v==="walls";const L=o.l??(walls?int(r,10,16):int(r,3,12)),W=o.w??(walls?int(r,8,14):int(r,2,10)),H=o.h??(walls?pick(r,[8,9,10]):int(r,2,10)),P=2*(L+W),lat=P*H,SA=lat+2*L*W;
  const q=walls?`Mia is painting the 4 walls of her room (not the floor or ceiling). The room is ${L} ft long, ${W} ft wide, and ${H} ft tall. How many square feet of wall will she paint? (Ignore doors and windows.)`:`A rectangular prism is ${L} in long, ${W} in wide, and ${H} in tall. Find its <b>lateral</b> surface area (the 4 side faces only, not the top and bottom).`;
  const u=walls?" ft<sup>2</sup>":" in<sup>2</sup>";
  return item("t10_lateral",o.lvl||(walls?"Word":"Basic"),q,fmt(lat)+u,
    T10_nb([[SA,walls?"That includes the floor and ceiling.":"That includes the top and bottom. Lateral means sides only."],[(L+W)*H,"That's only 2 of the 4 walls. Each wall has a matching one across from it."],[L*W*H,"That's the volume, not the area of the walls."]],u),
    [stp(r,{p:"What's a quick way to find the area of all 4 side faces?",good:"Perimeter of the base × height",bad:[["Length × width × height","That's volume."],["Length × width","That's the floor (the base)."]],t:"Unroll the 4 sides into one long rectangle. Its length is the perimeter of the base, and its height is the height.",a:`Perimeter: ${L} + ${W} + ${L} + ${W} = ?`,ans:P}),
     stp(r,{p:"Now?",good:`Multiply the perimeter by the height, ${H}`,bad:[["Add the height","Area multiplies."],["Double it","The perimeter already goes all the way around."]],a:`${P} × ${H} = ?`,ans:lat})],r)},

// ---------- 10-9 Volume ----------
t10_vol(r,o){const v=o.v||pick(r,VARS.t10_vol);const u=pick(r,["cm","in","ft","m"]),U=` ${u}<sup>3</sup>`;
  if(v==="missing"){const L=o.l??int(r,3,12),W=o.w??int(r,2,9),H=o.h??int(r,2,12),B=L*W,V=B*H;
    return item("t10_vol",o.lvl||"Challenge",`A rectangular prism has a volume of ${V} ${u}<sup>3</sup>. Its base is ${L} ${u} by ${W} ${u}. What is its height?`,`${H} ${u}`,
      T10_nb([[V-B,"Subtracting doesn't undo multiplying. V = B × h, so divide."],[V/L,`Divide by the whole base area (${L} × ${W}), not just one side.`],[B,"That's the base area B. Use it to find h."]].filter(([x])=>Number.isInteger(x)&&x!==H)," "+u).concat([[`${H+1} ${u}`,"Check: base area × height must equal the volume."]]),
      [stp(r,{p:"V = B × h. What is B?",good:"The area of the base, length × width",bad:[["The length of the base","B is an area."],["Length + width","Area multiplies."]],a:`${L} × ${W} = ?`,ans:B}),
       stp(r,{p:`${V} = ${B} × h. How do we find h?`,good:`Divide ${V} by ${B}`,bad:[[`Subtract ${B}`,"Undo multiplying with dividing."],[`Multiply ${V} by ${B}`,"That makes it bigger."]],a:`${V} ÷ ${B} = ?`,ans:H})],r)}
  if(v==="tri"){let b=o.b??int(r,3,12),th=o.th??int(r,2,10);if((b*th)%2)th++;const L=o.L??int(r,4,15),B=b*th/2,V=B*L;
    return item("t10_vol",o.lvl||"Basic",`A triangular prism has a triangle base with a base of ${b} ${u} and a height of ${th} ${u}. The prism is ${L} ${u} long. Find its volume.`,fmt(V)+U,
      T10_nb([[b*th*L,"The triangle's area is ½ × base × height. Don't forget the ½."],[B,"That's just the area of the triangle base. Multiply by the length."],[B+L,"V = B × h multiplies the base area by the length."]],U),
      [stp(r,{p:"V = B × h. What is B here?",good:"The area of the triangle: ½ × base × height",bad:[["base × height","A triangle is half of a rectangle."],["The length of the prism","B is the area of the base."]],a:`½ × ${b} × ${th} = ?`,ans:B}),
       stp(r,{p:"Now?",good:`Multiply B by the prism's length, ${L}`,bad:[["Add the length","Volume multiplies."],["Multiply by ½ again","The ½ was already used for the triangle."]],a:`${B} × ${L} = ?`,ans:V})],r)}
  const L=o.l??int(r,2,12),W=o.w??int(r,2,10),H=o.h??int(r,2,10),V=L*W*H;
  return item("t10_vol",o.lvl||"Basic",`Find the volume of a rectangular prism that is ${L} ${u} long, ${W} ${u} wide, and ${H} ${u} tall.`,fmt(V)+U,
    T10_nb([[2*(L*W+L*H+W*H),"That's the surface area (the faces), not the space inside."],[L*W,"That's only the base area. Multiply by the height."],[L+W+H,"Volume multiplies the three dimensions."]],U),
    [stp(r,{p:"Which formula gives the volume of a prism?",good:"V = B × h (base area × height)",bad:[["Add the faces","That's surface area."],["Add the three dimensions","Volume multiplies."]],a:`B = ${L} × ${W} = ?`,ans:L*W}),
     stp(r,{p:"Now?",good:`Multiply B by the height, ${H}`,bad:[["Add the height","Volume multiplies."]],a:`${L*W} × ${H} = ?`,ans:V})],r)},

t10_volword(r,o){const v=o.v||pick(r,VARS.t10_volword);
  if(v==="fill"){const L=o.l??int(r,3,8)*10,W=o.w??int(r,2,5)*10,H=o.h??int(r,3,6)*10,D=H-int(r,1,2)*5,V=L*W*D;
    return item("t10_volword",o.lvl||"Word",`A fish tank is ${L} cm long, ${W} cm wide, and ${H} cm tall. It is filled with water to a depth of ${D} cm. How much water is in the tank?`,`${fmt(V)} cm<sup>3</sup>`,
      T10_nb([[L*W*H,"That's the whole tank. The water is only " + D + " cm deep."],[L*W*(H-D),"That's the empty space above the water."],[L*W,"That's only the base area. Multiply by the water's depth."]]," cm<sup>3</sup>"),
      [stp(r,{p:"What shape does the water make?",good:`A rectangular prism ${D} cm tall`,bad:[[`A prism ${H} cm tall`,"The water doesn't reach the top."],["A cube","The sides aren't all equal."]],t:"The water fills the base of the tank up to its depth.",a:`Base area: ${L} × ${W} = ?`,ans:L*W}),
       stp(r,{p:"Now?",good:`Multiply by the water depth, ${D}`,bad:[[`Multiply by the tank height, ${H}`,"That's for a full tank."]],a:`${L*W} × ${D} = ?`,ans:V})],r)}
  if(v==="bags"){const L=o.l??int(r,4,10),W=o.w??int(r,2,4),H=o.h??pick(r,[1,2]),k=o.k??pick(r,[1.5,2,3]),V=L*W*H,raw=V/k,n=Math.ceil(raw-1e-9),fl=Math.floor(raw+1e-9);

Object.assign(G,{
t12_hyp(r,o){const v=o.v||pick(r,VARS.t12_hyp);

        t:`If the legs are k times a Pythagorean triple, the hypotenuse is k times too. (Squaring the legs directly also works.)`,a:`What is the greatest common factor of ${a} and ${b}?`,ans:k}),
       stp(r,{p:`Dividing by ${k} gives legs ${a0} and ${b0}. What's the hypotenuse of that smaller triangle?`,good:`Use ${T12.sq(a0)} + ${T12.sq(b0)} = c<sup>2</sup>, or remember the triple`,bad:[[`${a0} + ${b0}`,"Legs aren't added to get the hypotenuse."],[`${T12.sq(a0)} + ${T12.sq(b0)}, and stop there`,"That's c<sup>2</sup>. Take the square root too."]],t:`${T12.sq(a0)} + ${T12.sq(b0)} = ${a0*a0+b0*b0}, and √${a0*a0+b0*b0} is a whole number.`,a:"Small triangle's hypotenuse = ?",ans:c0}),
       stp(r,{p:"How do we get back to the original triangle?",good:`Multiply by ${k}`,bad:[[`Add ${k}`,"Scaling multiplies every side by the same number."],[`Divide by ${k} again`,"We divided to shrink it. Now we multiply to grow it back."]],t:"A scaled triangle has every side multiplied by the same number.",a:`${c0} × ${k} = ?`,ans:c0*k})],r)}
  if(v==="word"){const C=[["A rectangular field is","m long and","m wide. How long is a straight path from one corner to the opposite corner?",100],["A boat sails","km east, then","km north. How far is it from where it started, in a straight line?",30],["A rectangular gate is","ft wide and","ft tall. How long is the diagonal brace that goes from corner to corner?",17]];

t12_setup(r,o){const v=o.v||pick(r,VARS.t12_setup);
  if(v==="which"){
    if(r()<0.5){const t=T12.pickT(r,30);const order=shuffle(r,t);
      return item("t12_setup",o.lvl||"Basic",`The sides of a right triangle are ${order.join(", ")}. Which side is the hypotenuse?`,fmt(t[2]),[[fmt(t[0]),"That one is a leg. The hypotenuse sits across from the right angle, the biggest angle."],[fmt(t[1]),"That one is a leg. The hypotenuse sits across from the right angle, the biggest angle."],["You can't tell without a picture","You can tell from the lengths alone."]],
        [stp(r,{p:"What do we know about the hypotenuse?",good:"It's across from the right angle, so it's the longest side",bad:[["It's the shortest side","The shortest side is a leg."],["It's always the side listed last","The order the sides are listed in doesn't matter."]],t:"The right angle is the biggest angle in a right triangle, and the longest side is always across from the biggest angle.",a:`Which length is the longest: ${order.join(", ")}?`,kind:"choice",opts:order.map(String),ans:order.indexOf(t[2])})],r)}
    const nm=pick(r,["ABC","PQR","XYZ","DEF","JKL"]).split(""),i=int(r,0,2),V=nm[i],o2=nm.filter((x,j)=>j!==i);const side=(p,q)=>[p,q].sort().join("");

      [stp(r,{p:"Where is the hypotenuse?",good:"Across from the right angle",bad:[["Next to the right angle","The two sides that touch the right angle are the legs."],["Always along the bottom","A triangle can be turned any way. Use the right angle to find it."]],t:`The hypotenuse is the one side that does not touch the right-angle corner ${V}.`,a:`Which two vertices does the hypotenuse connect?`,kind:"choice",opts:[`${l1[0]} and ${l1[1]}`,`${o2[0]} and ${o2[1]}`,`${l2[0]} and ${l2[1]}`],ans:1})],r)}

    return item("t12_setup",o.lvl||"Challenge",`Squares are drawn on each side of a right triangle. The square on the hypotenuse has area ${fmt(C)} square units, and the square on one leg has area ${fmt(A)} square units. What is the area of the square on the other leg?`,`${fmt(B)} square units`,[[`${fmt(C+A)} square units`,"The hypotenuse square is the biggest. The other leg square must be smaller than it."],[`${fmt(t[1])} square units`,"That's the side length of that square, not its area."],[`${fmt((C-A)/2)} square units`,"There's no halving here. All of the leftover area belongs to the other leg's square."]],
      [stp(r,{p:"How do the three square areas relate?",good:"Leg square + leg square = hypotenuse square",bad:[["Hypotenuse square + leg square = other leg square","The hypotenuse square is the biggest one, so it's the total."],["All three are equal","Only in a picture that isn't to scale."]],t:`So ${fmt(A)} + (missing area) = ${fmt(C)}. Subtract to find the missing part.`,a:`${fmt(C)} − ${fmt(A)} = ?`,ans:B})],r)}
  // equation
  const t=T12.pickT(r,30);const x=pick(r,["x","n","s"]);

      [t13radStep(r,D,R),stp(r,{...formula,a:`${R}<sup>2</sup> = ?`,ans:R*R}),

    [stp(r,{...formula,a:`${R}<sup>2</sup> = ?`,ans:R*R}),
     stp(r,{p:`r<sup>2</sup> = ${R*R}. What's next?`,good:num?"Multiply by 4, then by 3.14":"Multiply by 4 and keep the π",bad:[["Multiply by 4/3","4/3 is for volume."],["Multiply by 2","That would be half a sphere."]],a:`4 × ${R*R} = ?`,ans:4*R*R,t:num?"Last, multiply that by 3.14.":"Write the result with π after it."})],r)},

      [t13radStep(r,D,R),stp(r,{...formula,a:`Base area: π × ${R}<sup>2</sup> = ?π ${t13coef}`,ans:R*R}),
       stp(r,{p:"We have the base area. What's next?",good:"Multiply it by the height",bad:[["Add the height","Volume stacks the base up the height. That's multiplying."],["Divide by 3","Only cones and pyramids get the 1/3."]],a:`${R*R}π × ${H} = ?π ${t13coef}`,ans:V})],r)}

t13_cylmiss(r,o){const v=o.v||pick(r,VARS.t13_cylmiss);const u=o.u||pick(r,T13U);
  if(v==="radius"){const R=o.R??int(r,3,10),H=o.H??int(r,2,12),K=R*R*H;

      [stp(r,{p:"In V = πr<sup>2</sup>h, what can we undo first?",good:"Divide both sides by π and by the height",bad:[["Take the square root of the volume","First get r<sup>2</sup> by itself; then take the square root."],["Subtract the height","π, r<sup>2</sup> and h are multiplied, so undo them by dividing."]],t:`${K}π = π · r<sup>2</sup> · ${H}. Divide both sides by ${H}π.`,a:`r<sup>2</sup> = ${K} ÷ ${H} = ?`,ans:R*R}),
       stp(r,{p:"That number is r<sup>2</sup>. How do we get r?",good:"Take the square root",bad:[["Divide by 2","Dividing by 2 undoes doubling, not squaring."],["Stop here, it's the radius","It's r squared, not r."]],t:"The square root undoes squaring.",a:`r = √${R*R} = ?`,ans:R})],r)}
  if(v==="word"){const R=o.R??int(r,2,6),H=o.H??int(r,4,16),D=2*R,V=RD(3.14*R*R*H);
    return item("t13_cylmiss",o.lvl||"Word",`A cylindrical can holds ${t13v(fmt(V),"cm")} of soup. The can has a diameter of ${D} cm. How tall is the can? ${T13USE}`,`${H} cm`,
      [[`${fmt(RD(H/4))} cm`,"That uses the diameter as the radius. The radius is half the diameter."],[`${fmt(R*H)} cm`,"That divides by 3.14 × r. The base area is 3.14 × r², so square the radius."],[`${fmt(R*R*H)} cm`,"That divides only by 3.14. Divide by the whole base area, 3.14 × r²."],[`${3*H} cm`,"That treats the can like a cone. A can is a cylinder: V = πr²h."]],
      [t13radStep(r,D,R),
       stp(r,{p:"How do we get h by itself in V = πr<sup>2</sup>h?",good:"Divide the volume by the base area (3.14 × r<sup>2</sup>)",bad:[["Subtract the base area from the volume","Volume is base area TIMES height, so undo it by dividing."],["Divide the volume by r","r is squared in the formula, so divide by 3.14 × r<sup>2</sup>."]],t:"h = V ÷ (3.14 × r<sup>2</sup>).",a:`Base area: 3.14 × ${R}<sup>2</sup> = ?`,ans:RD(3.14*R*R)}),
       stp(r,{p:"Now what?",good:"Divide the volume by that base area",bad:[["Multiply them","Multiplying would give a giant number. We're undoing a multiplication."],["Subtract","Volume is base area times height."]],a:`${fmt(V)} ÷ ${fmt(RD(3.14*R*R))} = ?`,ans:H})],r)}
  const R=o.R??int(r,2,9),H=o.H??int(r,2,15),K=R*R*H;
  return item("t13_cylmiss",o.lvl||"Basic",`A cylinder has a volume of ${t13v(t13pi(K),u)} and a radius of ${R} ${u}. What is its height?`,`${H} ${u}`,
    [[`${fmt(R*H)} ${u}`,"That divides by r once. The radius is squared in the formula."],[`${fmt(RD(R*H/2))} ${u}`,"That divides by 2r. The formula has r², not 2r."],[`${fmt(K-R*R)} ${u}`,"That subtracts the base area. Volume is base area TIMES height, so divide."],[`${3*H} ${u}`,"That treats it like a cone. A cylinder's volume is πr²h with no 1/3."]],
    [stp(r,{p:"How do we get h by itself in V = πr<sup>2</sup>h?",good:"Divide the volume by πr<sup>2</sup> (the base area)",bad:[["Subtract πr<sup>2</sup> from the volume","Volume is base area TIMES height, so undo it by dividing."],["Divide the volume by r","r is squared in the formula, so divide by r<sup>2</sup> (and π)."]],t:`${K}π = π · ${R}<sup>2</sup> · h.`,a:`Base area: π × ${R}<sup>2</sup> = ?π ${t13coef}`,ans:R*R}),
     stp(r,{p:"Now what?",good:"Divide the volume by the base area (the π's cancel)",bad:[["Multiply them","We're undoing a multiplication, so divide."],["Subtract","Volume is base area times height."]],a:`${K}π ÷ ${R*R}π = ?`,ans:H})],r)},

    [stp(r,{...formula,a:`π × ${R}<sup>2</sup> × ${H} = ?π ${t13coef}`,ans:K}),third(K)],r)},
